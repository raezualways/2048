<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2048 Premium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-user-select: none; user-select: none; }

:root, body.dark {
    --bg: #0f172a;
    --panel: rgba(30, 41, 59, 0.7);
    --empty: rgba(51, 65, 85, 0.3);
    --text: #f8fafc;
    --border: rgba(255, 255, 255, 0.08);
    --shadow: rgba(0, 0, 0, 0.3);
}
body.light {
    --bg: #f8fafc;
    --panel: rgba(241, 245, 249, 0.85);
    --empty: #e2e8f0;
    --text: #0f172a;
    --border: rgba(0, 0, 0, 0.06);
    --shadow: rgba(15, 23, 42, 0.08);
}
body.ocean {
    --bg: #0b1528;
    --panel: rgba(22, 38, 70, 0.75);
    --empty: rgba(30, 58, 102, 0.4);
    --text: #e2e8f0;
    --border: rgba(56, 189, 248, 0.15);
    --shadow: rgba(0, 0, 0, 0.4);
}
body.sakura {
    --bg: #fff1f2;
    --panel: rgba(255, 255, 255, 0.85);
    --empty: #ffe4e6;
    --text: #4c0519;
    --border: rgba(251, 113, 133, 0.2);
    --shadow: rgba(76, 5, 25, 0.05);
}
body.neon {
    --bg: #030008;
    --panel: rgba(22, 8, 43, 0.7);
    --empty: rgba(45, 20, 83, 0.3);
    --text: #ffffff;
    --border: rgba(192, 38, 211, 0.25);
    --shadow: rgba(0, 0, 0, 0.5);
}

body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; }
.app { width: 100%; max-width: 500px; height: 100dvh; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }

.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
h1 { font-size: 38px; font-weight: 900; letter-spacing: -1px; margin: 0; background: linear-gradient(45deg, var(--text), rgba(128,128,128,0.4)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.score-box { background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 16px; display: flex; gap: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px var(--shadow); }
.score-box span { color: var(--text); font-weight: 800; font-size: 16px; display: block; }
.score-label { opacity: 0.6; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }

.btn { border: 1px solid var(--border); padding: 12px 16px; border-radius: 16px; background: var(--panel); color: var(--text); font-weight: 700; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px var(--shadow); }
.btn:active { transform: scale(0.96); }

.boardWrap { flex: 1; display: grid; place-items: center; min-height: 0; padding: 10px 0; }
.board { width: min(90vw, 85dvh, 460px); aspect-ratio: 1; display: grid; gap: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 20px 40px var(--shadow); will-change: transform; }

.cell { width: 100%; height: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(18px, 6vw, 36px); border-radius: 16px; background: var(--empty); position: relative; color: var(--text); }
.tile { animation: spawn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; box-shadow: 0 4px 10px rgba(0,0,0,0.15); will-change: transform, opacity; }
.tile.merged { animation: pop 0.15s ease-in-out; }

@keyframes spawn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }

.controls { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 260px; margin: 10px auto 0 auto; }
.ctrl-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 16px; height: 54px; font-size: 22px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px var(--shadow); touch-action: manipulation; }
.ctrl-btn:active { transform: scale(0.92); background: var(--empty); }

/* СТИЛИ КУБОВ ДЛЯ ВСЕХ ТЕМ */
body.dark .v2 { background: #334155 !important; color: #f8fafc !important; } body.dark .v4 { background: #475569 !important; color: #f8fafc !important; } body.dark .v8 { background: #f97316 !important; color: #fff !important; } body.dark .v16 { background: #ea580c !important; color: #fff !important; } body.dark .v32 { background: #ef4444 !important; color: #fff !important; } body.dark .v64 { background: #dc2626 !important; color: #fff !important; } body.dark .v128 { background: #06b6d4 !important; color: #0f172a !important; box-shadow: 0 0 12px rgba(6,182,212,0.4); } body.dark .v256 { background: #0ea5e9 !important; color: #fff !important; box-shadow: 0 0 16px rgba(14,165,233,0.4); } body.dark .v512 { background: #3b82f6 !important; color: #fff !important; box-shadow: 0 0 20px rgba(59,130,246,0.5); } body.dark .v1024 { background: #6366f1 !important; color: #fff !important; } body.dark .v2048 { background: #a855f7 !important; color: #fff !important; box-shadow: 0 0 25px #a855f7; }
body.light .v2 { background: #cbd5e1 !important; color: #1e293b !important; } body.light .v4 { background: #94a3b8 !important; color: #f8fafc !important; } body.light .v8 { background: #ffedd5 !important; color: #ea580c !important; } body.light .v16 { background: #fed7aa !important; color: #c2410c !important; } body.light .v32 { background: #fdba74 !important; color: #9a3412 !important; } body.light .v64 { background: #f97316 !important; color: #fff !important; } body.light .v128 { background: #fca5a5 !important; color: #991b1b !important; } body.light .v256 { background: #ef4444 !important; color: #fff !important; } body.light .v512 { background: #93c5fd !important; color: #1e40af !important; } body.light .v1024 { background: #3b82f6 !important; color: #fff !important; } body.light .v2048 { background: #fcd34d !important; color: #78350f !important; box-shadow: 0 4px 12px rgba(251,191,36,0.4); }
body.ocean .v2 { background: #38bdf8 !important; color: #0b1528 !important; } body.ocean .v4 { background: #0ea5e9 !important; color: #fff !important; } body.ocean .v8 { background: #0284c7 !important; color: #fff !important; } body.ocean .v16 { background: #2563eb !important; color: #fff !important; } body.ocean .v32 { background: #3b82f6 !important; color: #fff !important; } body.ocean .v64 { background: #6366f1 !important; color: #fff !important; } body.ocean .v128 { background: #4f46e5 !important; color: #fff !important; } body.ocean .v256 { background: #7c3aed !important; color: #fff !important; } body.ocean .v512 { background: #9333ea !important; color: #fff !important; } body.ocean .v1024 { background: #c084fc !important; color: #0b1528 !important; } body.ocean .v2048 { background: #f472b6 !important; color: #fff !important; box-shadow: 0 0 20px #f472b6; }
body.sakura .v2 { background: #fff1f2 !important; color: #9f1239 !important; } body.sakura .v4 { background: #ffe4e6 !important; color: #9f1239 !important; } body.sakura .v8 { background: #fecdd3 !important; color: #9f1239 !important; } body.sakura .v16 { background: #fda4af !important; color: #4c0519 !important; } body.sakura .v32 { background: #f43f5e !important; color: #fff !important; } body.sakura .v64 { background: #e11d48 !important; color: #fff !important; } body.sakura .v128 { background: #be123c !important; color: #fff !important; } body.sakura .v256 { background: #9f1239 !important; color: #fff !important; } body.sakura .v512 { background: #881337 !important; color: #fff !important; } body.sakura .v1024 { background: #fb7185 !important; color: #fff !important; } body.sakura .v2048 { background: #fff !important; color: #e11d48 !important; border: 2px solid #e11d48; }
body.neon .v2 { background: #00f5ff !important; color: #030008 !important; box-shadow: 0 0 8px rgba(0,245,255,0.4); } body.neon .v4 { background: #00bfff !important; color: #fff !important; box-shadow: 0 0 10px rgba(0,191,255,0.4); } body.neon .v8 { background: #7000ff !important; color: #fff !important; } body.neon .v16 { background: #bd00ff !important; color: #fff !important; } body.neon .v32 { background: #ff00b7 !important; color: #fff !important; } body.neon .v64 { background: #ff0055 !important; color: #fff !important; } body.neon .v128 { background: #ff3300 !important; color: #fff !important; } body.neon .v256 { background: #ffaa00 !important; color: #030008 !important; } body.neon .v512 { background: #e7fe00 !important; color: #030008 !important; } body.neon .v1024 { background: #00ff66 !important; color: #030008 !important; } body.neon .v2048 { background: #fff !important; color: #030008 !important; box-shadow: 0 0 25px #fff; }

/* МЕНЮ */
.menu { position: fixed; inset: 0; display: none; background: rgba(3, 7, 18, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 10; opacity: 0; transition: opacity 0.25s ease; }
.menu.open { display: flex; align-items: flex-end; justify-content: center; opacity: 1; }

.sheet { width: min(100vw, 440px); background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); padding: 24px; border-radius: 32px 32px 0 0; max-height: 85dvh; overflow: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.3); transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
body.light .sheet { background: rgba(255, 255, 255, 0.95); border-color: rgba(0,0,0,0.06); }
.menu.open .sheet { transform: translateY(0); }

.section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; margin-bottom: 10px; }

.grid-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid-opts.themes { grid-template-columns: repeat(2, 1fr); }
.grid-opts.themes .opt:last-child { grid-column: span 2; }

.opt { width: 100%; padding: 12px 8px; border: 1px solid var(--border); border-radius: 16px; background: var(--empty); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.opt:active { background: var(--panel); transform: scale(0.97); }
.opt-wide { grid-column: span 3; background: var(--panel); font-weight: 700; font-size: 15px; padding: 16px; color: #38bdf8; margin-top: 5px;}
.opt-share { color: #22c55e !important; }
.opt-leader { color: #eab308 !important; }

.toggle-box { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--empty); padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border); font-weight: 600; font-size: 14px; }
.switch { position: relative; display: inline-block; width: 46px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background-color: rgba(128,128,128,0.3); transition: .3s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
input:checked + .slider { background-color: #22c55e; }
input:checked + .slider:before { transform: translateX(20px); }

.close-btn { background: none; border: 0; color: var(--text); font-size: 20px; opacity: 0.5; cursor: pointer; padding: 4px; }

.leader-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.leader-item { display: flex; justify-content: space-between; align-items: center; background: var(--empty); padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border); font-weight: 600; }
.leader-name { display: flex; align-items: center; gap: 10px; }
.leader-rank { font-weight: 800; color: #eab308; width: 20px; }
.leader-score { font-weight: 800; color: #38bdf8; }
</style>
</head>

<body class="dark">

<div class="app">
    <div class="top">
        <h1>2048</h1>
        <div style="display: flex; gap: 8px; align-items: center;">
            <div class="score-box">
                <div><div class="score-label">Счет</div><span id="score">0</span></div>
                <div style="border-left: 1px solid var(--border); padding-left: 12px;"><div class="score-label">Рекорд</div><span id="best">0</span></div>
            </div>
            <button class="btn" onclick="openMenu('mainMenu')">⚙️</button>
        </div>
    </div>

    <div class="boardWrap"><div id="board" class="board"></div></div>

    <div id="keyboardControls" class="controls">
        <div></div><button class="ctrl-btn" onclick="move('u')">▲</button><div></div>
        <button class="ctrl-btn" onclick="move('l')">◀</button><button class="ctrl-btn" onclick="move('d')">▼</button><button class="ctrl-btn" onclick="move('r')">▶</button>
    </div>
</div>

<div id="mainMenu" class="menu" onclick="closeMenu(event, 'mainMenu')">
    <div class="sheet">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; font-size:22px; font-weight:800;">Настройки</h2>
            <button class="close-btn" onclick="closeMenu(null, 'mainMenu', true)">✕</button>
        </div>

        <div class="section">
            <div class="section-title">🏆 Соревнования</div>
            <button class="opt opt-wide opt-leader" onclick="openLeaderboard()">🥇 Таблица лидеров</button>
            <button class="opt opt-wide opt-share" onclick="shareResult()">🚀 Поделиться рекордом</button>
        </div>

        <div class="section">
            <div class="section-title">🎮 Управление</div>
            <div class="toggle-box">
                <span>Кнопки на экране</span>
                <label class="switch">
                    <input type="checkbox" id="btnToggle" onchange="toggleButtons(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="section">
            <div class="section-title">🎨 Темы оформления</div>
            <div class="grid-opts themes">
                <button class="opt" onclick="theme('dark')">🌙 Dark</button>
                <button class="opt" onclick="theme('light')">☀️ Light</button>
                <button class="opt" onclick="theme('ocean')">🌊 Ocean</button>
                <button class="opt" onclick="theme('sakura')">🌸 Sakura</button>
                <button class="opt" onclick="theme('neon')">⚡ Neon</button>
            </div>
        </div>

        <div class="section"><button class="opt opt-wide" onclick="start()">🔄 Новая игра</button></div>
    </div>
</div>

<div id="leaderMenu" class="menu" onclick="closeMenu(event, 'leaderMenu')">
    <div class="sheet">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; font-size:22px; font-weight:800;">Топ игроков мира</h2>
            <button class="close-btn" onclick="closeMenu(null, 'leaderMenu', true)">✕</button>
        </div>
        <div id="leaderboardContent" class="leader-list"></div>
    </div>
</div>

<script>
let size=4, scoreV=0, bestV=0, g=[], prevG=[];
let playerName = "Игрок";

// Безопасное получение элементов DOM
const board = document.getElementById('board');
const score = document.getElementById('score');
const best = document.getElementById('best');

function openMenu(id) {
    const m = document.getElementById(id);
    if(m) {
        m.style.display = 'flex';
        setTimeout(() => m.classList.add('open'), 10);
    }
}

function closeMenu(e, id, force = false) {
    const m = document.getElementById(id);
    if (m && (force || e.target === m)) {
        m.classList.remove('open');
        setTimeout(() => m.style.display = 'none', 250);
    }
}

function openLeaderboard() {
    closeMenu(null, 'mainMenu', true);
    openMenu('leaderMenu');
    
    const container = document.getElementById('leaderboardContent');
    if(!container) return;
    container.innerHTML = "";

    let baseLeaders = [
        { name: "👑 CyberDur0v", score: 24800 },
        { name: "Pavel_Net", score: 18240 },
        { name: "CryptoBoss", score: 12500 },
        { name: "Ton_Holder", score: 9640 },
        { name: "Web3_Warrior", score: 7200 }
    ];

    baseLeaders.push({ name: "⭐ " + playerName + " (Вы)", score: bestV });
    baseLeaders.sort((a, b) => b.score - a.score);

    baseLeaders.slice(0, 8).forEach((player, index) => {
        const item = document.createElement('div');
        item.className = 'leader-item';
        if (player.name.includes("(Вы)")) {
            item.style.borderColor = "#eab308";
            item.style.background = "rgba(234, 179, 8, 0.1)";
        }
        item.innerHTML = `
            <div class="leader-name">
                <span class="leader-rank">#${index + 1}</span>
                <span>${player.name}</span>
            </div>
            <span class="leader-score">${player.score}</span>
        `;
        container.appendChild(item);
    });
}

function loadBest() {
    bestV = parseInt(localStorage.getItem('best_score_v2')) || parseInt(localStorage.best) || 0;
    if(best) best.textContent = bestV;
}

function saveBest(){
    if (scoreV > bestV) {
        bestV = scoreV;
        if(best) best.textContent = bestV;
        localStorage.setItem('best_score_v2', bestV.toString());
    }
}

function shareResult() {
    const text = `🔥 Я набрал ${scoreV} очков в 2048 Premium! Сможешь побить? 🎮`;
    window.open(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`, '_blank');
}

function mk(){
    let arr = [];
    for(let i=0; i<size; i++) {
        arr.push(new Array(size).fill(0));
    }
    return arr;
}

function add(){
    let f=[];
    for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(!g[y][x]) f.push([y,x]);
    if(!f.length) return;
    let p=f[Math.random()*f.length|0];
    g[p[0]][p[1]]=Math.random()<.9?2:4;
}

function slide(r, m){
    r=r.filter(Boolean);
    for(let i=0;i<r.length-1;i++) {
        if(r[i]==r[i+1]){ r[i]*=2; scoreV+=r[i]; r[i+1]=0; }
    }
    r=r.filter(Boolean); while(r.length<size) r.push(0); return r;
}

function move(d){
    let old=JSON.stringify(g); prevG = JSON.parse(old);
    if(d=="l") g=g.map(r => slide(r))
    if(d=="r") g=g.map(r=>slide([...r].reverse()).reverse())
    if(d=="u"||d=="d"){
        for(let x=0;x<size;x++){
            let c=g.map(r=>r[x]); if(d=="d") c.reverse(); c=slide(c); if(d=="d") c.reverse();
            for(let y=0;y<size;y++) g[y][x]=c[y];
        }
    }
    if(old!=JSON.stringify(g)) { add(); render(true); }
}

function render(animate = false){
    if(!board) return;
    board.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;
    board.innerHTML="";
    for(let y=0;y<size;y++){
        for(let x=0;x<size;x++){
            let v=g[y][x], d=document.createElement("div");
            d.className="cell "+(v?"tile v"+v:"");
            d.textContent=v||"";
            if(animate && v && prevG[y] && prevG[y][x] !== v && prevG[y][x] !== 0) d.classList.add('merged');
            board.append(d);
        }
    }
    if(score) score.textContent=scoreV; saveBest();
}

function start(){ scoreV=0; g=mk(); prevG=mk(); add(); add(); closeMenu(null, 'mainMenu', true); render(); }
function theme(t){ document.body.className=t; localStorage.theme=t; }
function toggleButtons(show) { 
    const ctrl = document.getElementById('keyboardControls');
    if(ctrl) ctrl.style.display = show ? 'grid' : 'none'; 
    localStorage.showButtons = show ? '1' : '0'; 
}

document.onkeydown=e=>{ const k={ArrowLeft:"l",ArrowRight:"r",ArrowUp:"u",ArrowDown:"d"}[e.key]; if(k) { e.preventDefault(); move(k); } }
let sx,sy; document.body.onTouchStart = board.ontouchstart=e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }; board.ontouchmove=e=>{ e.preventDefault(); }
board.ontouchend=e=>{
    let dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx) > 15 || Math.abs(dy) > 15) move(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"));
}

theme(localStorage.theme || "dark");
const showButtons = localStorage.showButtons === '1';
const btnT = document.getElementById('btnToggle');
if(btnT) btnT.checked = showButtons; toggleButtons(showButtons);
loadBest(); start();
</script>
</body>
</html>
