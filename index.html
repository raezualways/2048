<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 • Премиум</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a14;
            --card: rgba(20, 20, 40, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --fg: #e8e8f0;
            --muted: #8a8aa8;
            --accent: #a478f0;
            --accent2: #60b0f0;
            --grid-bg: rgba(16, 16, 32, 0.7);
            --cell-bg: rgba(30, 30, 50, 0.6);
            --glass: rgba(255, 255, 255, 0.04);
            --glow-strong: 0 0 30px rgba(160, 120, 240, 0.4);
            --glow-soft: 0 0 15px rgba(100, 160, 240, 0.25);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 22px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.light-theme {
            --bg: #f0f0f8;
            --card: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 0, 0, 0.08);
            --fg: #1a1a2e;
            --muted: #6a6a82;
            --accent: #7c4cf0;
            --accent2: #3a8ec0;
            --grid-bg: rgba(230, 230, 242, 0.8);
            --cell-bg: rgba(210, 210, 228, 0.7);
            --glass: rgba(255, 255, 255, 0.6);
            --glow-strong: 0 0 25px rgba(120, 70, 240, 0.25);
            --glow-soft: 0 0 12px rgba(50, 130, 200, 0.2);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100dvh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            user-select: none;
            transition: background 0.4s, color 0.4s;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(140, 80, 240, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(60, 140, 240, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(100, 100, 200, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: bgShift 20s ease-in-out infinite;
        }
        @keyframes bgShift {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(140, 100, 240, 0.4));
        }
        .header-btns {
            display: flex;
            gap: 10px;
        }
        .icon-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .icon-btn:hover {
            color: var(--fg);
            border-color: var(--accent);
            box-shadow: var(--glow-soft);
            transform: translateY(-1px);
        }
        .icon-btn:disabled {
            opacity: 0.25;
            cursor: default;
            pointer-events: none;
        }
        .info-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .info-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: all var(--transition);
        }
        .info-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .info-card .label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .info-card .value {
            font-size: 24px;
            font-weight: 800;
        }
        .score-val { color: var(--accent); }
        .best-val { color: var(--accent2); }
        .combo-badge {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            font-weight: 900;
            font-size: 28px;
            padding: 10px 24px;
            border-radius: 50px;
            z-index: 300;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
            animation: comboPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }
        .timer-row {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--muted);
            gap: 8px;
            align-items: center;
            background: var(--glass);
            border-radius: 20px;
            padding: 6px 16px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .grid-wrapper {
            position: relative;
            aspect-ratio: 1;
            background: var(--grid-bg);
            border-radius: var(--radius-lg);
            padding: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            touch-action: none;
            transition: filter 0.4s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .grid-wrapper.blurred {
            filter: blur(8px);
            pointer-events: none;
        }
        .grid-bg {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            height: 100%;
        }
        .cell-bg {
            background: var(--cell-bg);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .tiles-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
            z-index: 2;
        }
        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-weight: 800;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            transition: left 0.13s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.13s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: left, top, transform;
            z-index: 1;
        }
        .tile.new {
            animation: tilePop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .tile.merged {
            animation: tileMerge 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            z-index: 5;
        }
        @keyframes tilePop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes tileMerge {
            0% { transform: scale(1); }
            35% { transform: scale(1.22); }
            100% { transform: scale(1); }
        }
        .merge-particle {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffd700;
            animation: particleBurst 0.6s ease-out forwards;
        }
        @keyframes particleBurst {
            0% { transform: translate(0,0) scale(1); opacity:1; }
            100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity:0; }
        }
        .score-popup {
            position: absolute;
            font-size: 20px;
            font-weight: 900;
            color: #ffd700;
            pointer-events: none;
            z-index: 15;
            animation: floatUp 0.8s cubic-bezier(0.25,0.8,0.25,1) forwards;
            text-shadow: 0 0 12px rgba(255,215,0,0.7);
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.7); opacity:0; }
            30% { transform: translateY(-15px) scale(1.15); opacity:1; }
            100% { transform: translateY(-60px) scale(0.9); opacity:0; }
        }
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 500;
            animation: confettiFall linear forwards;
            font-size: 20px;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity:1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity:0; }
        }
        .game-overlay {
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(10,10,22,0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .game-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay-title {
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .overlay-sub {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.5;
        }
        .btn {
            padding: 13px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            font-size: 14px;
            border: none;
            transition: all var(--transition);
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(140,100,240,0.35);
        }
        .btn-ghost {
            background: var(--card);
            color: var(--fg);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            width: 90%;
            max-width: 420px;
            max-height: 82vh;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-title {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-close {
            display: block;
            margin: 20px auto 0;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 22px;
            cursor: pointer;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .settings-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }
        .settings-item i { font-size: 26px; color: var(--accent); }
        .settings-item span { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
        .daily-desc {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 16px;
            margin: 16px 0;
            border: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.5;
        }
        .daily-desc strong { color: var(--accent2); }
        @media (max-width: 380px) {
            .app { padding: 8px; }
            .logo { font-size: 30px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo">2048</div>
        <div class="header-btns">
            <button class="icon-btn" id="undoBtn" title="Отменить ход (Ctrl+Z)"><i class="fas fa-undo"></i></button>
            <button class="icon-btn" id="newGameBtn" title="Новая игра"><i class="fas fa-plus-circle"></i></button>
            <button class="icon-btn" id="settingsBtn" title="Меню"><i class="fas fa-cog"></i></button>
        </div>
    </header>
    <div class="info-bar">
        <div class="info-card"><div class="label">Счёт</div><div class="value score-val" id="scoreDisplay">0</div></div>
        <div class="info-card"><div class="label">Рекорд</div><div class="value best-val" id="bestDisplay">0</div></div>
    </div>
    <div class="timer-row"><i class="fas fa-clock"></i> Время: <span id="timerDisplay">00:00</span></div>
    <div class="grid-wrapper" id="board">
        <div class="grid-bg">
            <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
            <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
            <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
            <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
        </div>
        <div class="tiles-container" id="tilesContainer"></div>
        <div class="game-overlay" id="gameOverlay">
            <div class="overlay-title" id="overlayTitle"></div>
            <div class="overlay-sub" id="overlaySub"></div>
            <div class="overlay-btns">
                <button class="btn btn-ghost" id="overlayContinue" style="display:none;">Продолжить</button>
                <button class="btn btn-ghost" id="overlayClose" style="display:none;">Смотреть</button>
                <button class="btn btn-primary" id="overlayRestart">Заново</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальные окна -->
<div class="modal-overlay" id="settingsOverlay">
    <div class="modal-panel">
        <div class="modal-title">Меню</div>
        <div class="settings-grid">
            <div class="settings-item" data-target="themes"><i class="fas fa-palette"></i><span>Темы</span></div>
            <div class="settings-item" data-target="stats"><i class="fas fa-chart-bar"></i><span>Статистика</span></div>
            <div class="settings-item" data-target="achievements"><i class="fas fa-medal"></i><span>Достижения</span></div>
            <div class="settings-item" data-target="leaderboard"><i class="fas fa-list-ol"></i><span>Лидеры</span></div>
            <div class="settings-item" data-target="daily"><i class="fas fa-calendar-check"></i><span>Вызов дня</span></div>
            <div class="settings-item" data-target="share"><i class="fas fa-share-alt"></i><span>Поделиться</span></div>
        </div>
        <button class="modal-close" id="settingsClose"><i class="fas fa-times"></i></button>
    </div>
</div>

<div class="modal-overlay" id="themeOverlay">
    <div class="modal-panel">
        <div class="modal-title">Тема оформления</div>
        <label class="theme-option"><input type="radio" name="theme" value="dark" checked> Тёмная</label>
        <label class="theme-option"><input type="radio" name="theme" value="light"> Светлая</label>
        <button class="modal-close" id="themeClose"><i class="fas fa-times"></i></button>
    </div>
</div>

<div class="modal-overlay" id="statsOverlay">
    <div class="modal-panel">
        <div class="modal-title">Статистика</div>
        <div class="stats-grid">
            <div class="stat-item"><div class="stat-label">Игр</div><div class="stat-value" id="statGames">0</div></div>
            <div class="stat-item"><div class="stat-label">Побед</div><div class="stat-value" style="color:var(--accent2)" id="statWins">0</div></div>
            <div class="stat-item"><div class="stat-label">Макс. плитка</div><div class="stat-value" style="color:#f0c040" id="statMaxTile">-</div></div>
            <div class="stat-item"><div class="stat-label">Общий счёт</div><div class="stat-value" style="color:var(--accent)" id="statTotalScore">0</div></div>
            <div class="stat-item"><div class="stat-label">Ходов</div><div class="stat-value" id="statTotalMoves">0</div></div>
            <div class="stat-item"><div class="stat-label">Лучшее время</div><div class="stat-value" id="statBestTime">--:--</div></div>
        </div>
        <button class="modal-close" id="statsClose"><i class="fas fa-times"></i></button>
    </div>
</div>

<div class="modal-overlay" id="achievementsOverlay">
    <div class="modal-panel">
        <div class="modal-title">Достижения</div>
        <div id="achievementsContainer"></div>
        <button class="modal-close" id="achievementsClose"><i class="fas fa-times"></i></button>
    </div>
</div>

<div class="modal-overlay" id="leaderboardOverlay">
    <div class="modal-panel">
        <div class="modal-title">Ваш рекорд</div>
        <div id="leaderboardList" style="margin-top:12px;"></div>
        <button class="modal-close" id="leaderboardClose"><i class="fas fa-times"></i></button>
    </div>
</div>

<div class="modal-overlay" id="dailyOverlay">
    <div class="modal-panel">
        <div class="modal-title">Ежедневный вызов</div>
        <div id="dailyDescription" class="daily-desc"></div>
        <button class="btn btn-primary" id="startDailyBtn" style="width:100%;">Начать вызов</button>
        <button class="modal-close" id="dailyClose"><i class="fas fa-times"></i></button>
    </div>
</div>

<div class="modal-overlay" id="shareOverlay">
    <div class="modal-panel">
        <div class="modal-title">Поделиться</div>
        <p style="text-align:center; color:var(--muted); margin-bottom:20px;">Расскажите о своём рекорде в Telegram</p>
        <button class="btn btn-primary" id="shareTelegramBtn" style="width:100%;"><i class="fab fa-telegram-plane"></i> Поделиться в Telegram</button>
        <button class="modal-close" id="shareClose"><i class="fas fa-times"></i></button>
    </div>
</div>

<script>
(function() {
    'use strict';
    const TILE_COLORS = {
        2:{bg:'#2e2e4a',color:'#b0b0d0'},4:{bg:'#3a3058',color:'#c8b8e8'},8:{bg:'#c06830',color:'#fff'},
        16:{bg:'#d87830',color:'#fff'},32:{bg:'#e05040',color:'#fff'},64:{bg:'#e03030',color:'#fff'},
        128:{bg:'#f0b820',color:'#fff'},256:{bg:'#f0c008',color:'#fff'},512:{bg:'#f0d008',color:'#fff'},
        1024:{bg:'#9060e8',color:'#fff'},2048:{bg:'#5090f0',color:'#fff'},4096:{bg:'#30c8c8',color:'#fff'},
        8192:{bg:'#e840a8',color:'#fff'}
    };
    const LIGHT_TILE_COLORS = {
        2:{bg:'#d8d8e8',color:'#3a3a5c'},4:{bg:'#ccc0e8',color:'#3a3050'},8:{bg:'#f4a860',color:'#fff'},
        16:{bg:'#f48450',color:'#fff'},32:{bg:'#f46450',color:'#fff'},64:{bg:'#e84444',color:'#fff'},
        128:{bg:'#f4c830',color:'#fff'},256:{bg:'#f4d018',color:'#fff'},512:{bg:'#f4dc10',color:'#fff'},
        1024:{bg:'#b488f4',color:'#fff'},2048:{bg:'#70a4f4',color:'#fff'},4096:{bg:'#50d8d8',color:'#fff'},
        8192:{bg:'#f464b8',color:'#fff'}
    };
    function getTileStyle(v){ return (document.body.classList.contains('light-theme')?LIGHT_TILE_COLORS:TILE_COLORS)[v] || {bg:'#222',color:'#888'}; }

    const dailyChallenges = [
        { desc: "Достигните плитки <strong>512</strong> менее чем за <strong>60 ходов</strong>.", type:"targetTile", target:512, maxMoves:60 },
        { desc: "Наберите <strong>3000 очков</strong> без движения <strong>вверх</strong>.", type:"score", targetScore:3000, forbiddenDir:"up" },
        { desc: "Создайте плитку <strong>1024</strong>, используя не более <strong>80 ходов</strong>.", type:"targetTile", target:1024, maxMoves:80 },
        { desc: "Наберите <strong>2000 очков</strong> без движения <strong>вправо</strong>.", type:"score", targetScore:2000, forbiddenDir:"right" },
        { desc: "Достигните плитки <strong>256</strong> за <strong>30 ходов</strong>.", type:"targetTile", target:256, maxMoves:30 }
    ];

    const Game = {
        tilesContainer: document.getElementById('tilesContainer'),
        scoreDisplay: document.getElementById('scoreDisplay'),
        bestDisplay: document.getElementById('bestDisplay'),
        timerDisplay: document.getElementById('timerDisplay'),
        gameOverlay: document.getElementById('gameOverlay'),
        overlayTitle: document.getElementById('overlayTitle'),
        overlaySub: document.getElementById('overlaySub'),
        overlayContinue: document.getElementById('overlayContinue'),
        overlayClose: document.getElementById('overlayClose'),
        overlayRestart: document.getElementById('overlayRestart'),
        board: document.getElementById('board'),
        undoBtn: document.getElementById('undoBtn'),
        newGameBtn: document.getElementById('newGameBtn'),
        settingsBtn: document.getElementById('settingsBtn'),

        grid: Array.from({length:4},()=>Array(4).fill(null)),
        score:0, bestScore:0, moves:0, tileIdCounter:0,
        gameOver:false, gameWon:false, winOverlayShown:false,
        timerSeconds:0, timerInterval:null, history:[], gameFinished:false,
        cellSize:0, saveTimeout:null, tileElements:new Map(),
        stats:{games:0,wins:0,maxTile:0,totalScore:0,bestTime:null,totalMoves:0,totalTime:0},
        achievements:[
            {id:'score100',name:'100 очков',desc:'Набрать 100 очков',icon:'🎯',target:100,progress:()=>Game.stats.totalScore},
            {id:'score500',name:'500 очков',desc:'Набрать 500 очков',icon:'⭐',target:500,progress:()=>Game.stats.totalScore},
            {id:'score2000',name:'2000 очков',desc:'Набрать 2000 очков',icon:'🌟',target:2000,progress:()=>Game.stats.totalScore},
            {id:'tile512',name:'Плитка 512',desc:'Создать плитку 512',icon:'🟧',target:1,progress:()=>Game.stats.maxTile>=512?1:0},
            {id:'tile1024',name:'Плитка 1024',desc:'Создать плитку 1024',icon:'🟪',target:1,progress:()=>Game.stats.maxTile>=1024?1:0},
            {id:'tile2048',name:'Плитка 2048',desc:'Достигнуть 2048',icon:'👑',target:1,progress:()=>Game.stats.wins>0?1:0},
            {id:'tile4096',name:'Плитка 4096',desc:'Создать плитку 4096',icon:'💎',target:1,progress:()=>Game.stats.maxTile>=4096?1:0},
            {id:'tile8192',name:'Плитка 8192',desc:'Создать плитку 8192',icon:'🔮',target:1,progress:()=>Game.stats.maxTile>=8192?1:0},
            {id:'games5',name:'5 игр',desc:'Сыграть 5 игр',icon:'🎮',target:5,progress:()=>Game.stats.games},
            {id:'games20',name:'20 игр',desc:'Сыграть 20 игр',icon:'🕹️',target:20,progress:()=>Game.stats.games},
            {id:'moves50',name:'50 ходов',desc:'Сделать 50 ходов',icon:'♟️',target:50,progress:()=>Game.stats.totalMoves},

        ],
        unlockedAchievements:[],
        leaderboard: [],
        dailyChallenge: null, // активный вызов дня
        dailyCompleted: false
    };

    function formatTime(s){ const m=Math.floor(s/60).toString().padStart(2,'0'); return `${m}:${(s%60).toString().padStart(2,'0')}`; }
    function getVector(dir){ return {up:{dr:-1,dc:0},down:{dr:1,dc:0},left:{dr:0,dc:-1},right:{dr:0,dc:1}}[dir]; }

    Game.addRandomTile = function(){
        const empty=[];
        for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!this.grid[r][c]) empty.push({r,c});
        if(!empty.length) return;
        const {r,c}=empty[Math.floor(Math.random()*empty.length)];
        this.grid[r][c]={id:++this.tileIdCounter, value:Math.random()<0.9?2:4, isNew:true, merged:false};
    };

    Game.isGameOver = function(){
        for(let r=0;r<4;r++) for(let c=0;c<4;c++){
            if(!this.grid[r][c]) return false;
            const v=this.grid[r][c].value;
            if(r<3&&this.grid[r+1][c]&&this.grid[r+1][c].value===v) return false;
            if(c<3&&this.grid[r][c+1]&&this.grid[r][c+1].value===v) return false;
        }
        return true;
    };

    Game.hasWinningTile = function(){
        for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(this.grid[r][c]&&this.grid[r][c].value>=2048) return true;
        return false;
    };

    Game.pushState = function(){
        this.history.push({
            grid: this.grid.map(row=>row.map(t=>t?{...t}:null)),
            score:this.score, moves:this.moves, timerSeconds:this.timerSeconds,
            gameOver:this.gameOver, gameWon:this.gameWon, winOverlayShown:this.winOverlayShown
        });
        if(this.history.length>30) this.history.shift();
    };

    Game.popState = function(){
        if(!this.history.length) return false;
        const prev=this.history.pop();
        this.grid=prev.grid.map(row=>row.map(t=>t?{...t,isNew:false,merged:false}:null));
        this.score=prev.score; this.moves=prev.moves; this.timerSeconds=prev.timerSeconds;
        this.gameOver=prev.gameOver; this.gameWon=prev.gameWon; this.winOverlayShown=prev.winOverlayShown;
        this.timerDisplay.textContent=formatTime(this.timerSeconds);
        this.scoreDisplay.textContent=this.score; this.bestDisplay.textContent=this.bestScore;
        if(this.gameOver&&!this.isGameOver()){ this.gameOver=false; this.startTimer(); }
        return true;
    };

    // Основное движение с комбо и ежедневными условиями
    Game.move = function(direction){
        if(this.gameOver||this.winOverlayShown) return;
        if(isAnyOverlayOpen()) return;
        if(this.dailyChallenge?.forbiddenDir===direction) return; // запрет направления в вызове

        this.pushState();
        const vec=getVector(direction);
        let moved=false, gained=0;
        const mergedPositions=[];

        const traverse=(cb)=>{ const rng=[0,1,2,3]; if(vec.dr===1) rng.reverse(); if(vec.dc===1) rng.reverse(); for(const r of rng) for(const c of rng) cb(r,c); };
        const compress=()=>{ let ch=false; traverse((r,c)=>{ const t=this.grid[r][c]; if(!t) return; let nr=r,nc=c; while(true){ const tr=nr+vec.dr,tc=nc+vec.dc; if(tr<0||tr>3||tc<0||tc>3) break; if(this.grid[tr][tc]) break; nr=tr; nc=tc; } if(nr!==r||nc!==c){ this.grid[nr][nc]=t; this.grid[r][c]=null; ch=true; } }); return ch; };
        const merge=()=>{ let ch=false; traverse((r,c)=>{ const t=this.grid[r][c]; if(!t||t.merged) return; const nr=r+vec.dr,nc=c+vec.dc; if(nr<0||nr>3||nc<0||nc>3) return; const n=this.grid[nr][nc]; if(n&&n.value===t.value&&!n.merged){ n.value*=2; n.merged=true; this.grid[r][c]=null; gained+=n.value; this.stats.maxTile=Math.max(this.stats.maxTile,n.value); mergedPositions.push({r:nr,c:nc}); ch=true; } }); return ch; };

        const m1=compress(); const m2=merge(); const m3=compress();
        moved=m1||m2||m3;
        if(!moved){ this.history.pop(); return; }

        // Комбо-множитель
        const comboCount = mergedPositions.length;
        let comboBonus = 0;
        if(comboCount>1){
            comboBonus = Math.floor(gained * (comboCount-1) * 0.2);
            gained += comboBonus;
            this.showComboBadge(comboCount, comboBonus);
        }

        this.score+=gained; this.moves++;
        if(this.score>this.bestScore){ this.bestScore=this.score; localStorage.setItem('best2048',this.bestScore); }
        this.addRandomTile();
        this.renderTiles(mergedPositions, gained);
        if(mergedPositions.length) this.spawnMergeParticles(mergedPositions);

        for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(this.grid[r][c]) this.grid[r][c].merged=false;

        // Проверка условий ежедневного вызова
        if(this.dailyChallenge && !this.dailyCompleted){
            let challengeDone = false;
            if(this.dailyChallenge.type==='targetTile'){
                let maxTile=0; for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(this.grid[r][c]&&this.grid[r][c].value>maxTile) maxTile=this.grid[r][c].value;
                if(maxTile>=this.dailyChallenge.target && this.moves<=this.dailyChallenge.maxMoves) challengeDone=true;
                else if(this.moves>this.dailyChallenge.maxMoves) challengeDone=false; // проигрыш?
            } else if(this.dailyChallenge.type==='score'){
                if(this.score>=this.dailyChallenge.targetScore) challengeDone=true;
            }
            if(challengeDone){
                this.dailyCompleted=true;
                alert('🎉 Вы выполнили ежедневный вызов!');
                this.dailyChallenge=null;
            } else if(this.isGameOver()){
                alert('😞 Вызов дня не пройден. Попробуйте завтра!');
                this.dailyChallenge=null;
            }
        }

        if(!this.gameWon&&this.hasWinningTile()){
            this.gameWon=true; this.winOverlayShown=true; this.stopTimer(); this.spawnConfetti();
            setTimeout(()=>this.showOverlay('win'),400);
        } else if(!this.gameOver&&this.isGameOver()){
            this.gameOver=true; this.stopTimer(); this.showOverlay('lose');
        }
        this.undoBtn.disabled=this.history.length===0;
        this.scheduleSave(); this.checkNewAchievements();
    };

    Game.showComboBadge = function(count, bonus){
        const badge = document.createElement('div');
        badge.className = 'combo-badge';
        badge.textContent = `🔥 Комбо x${count} +${bonus}`;
        document.body.appendChild(badge);
        setTimeout(()=>badge.remove(), 900);
    };

    Game.spawnMergeParticles = function(positions){
        const container=this.tilesContainer, cellSize=this.cellSize;
        positions.forEach(pos=>{
            const cx=pos.c*(cellSize+10)+cellSize/2, cy=pos.r*(cellSize+10)+cellSize/2;
            for(let i=0;i<8;i++){
                const p=document.createElement('div'); p.className='merge-particle';
                const ang=Math.PI*2*i/8, dist=25+Math.random()*20;
                p.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;background:hsl(${40+Math.random()*20},90%,${55+Math.random()*20}%);width:${5+Math.random()*6}px;height:${5+Math.random()*6}px;`;
                container.appendChild(p); setTimeout(()=>p.remove(),600);
            }
        });
    };

    Game.spawnConfetti = function(){
        const emojis=['🎉','✨','🌟','💫','🏆','👑','💎','🎊'];
        for(let i=0;i<40;i++) setTimeout(()=>{
            const el=document.createElement('div'); el.className='confetti'; el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
            el.style.left=Math.random()*100+'%'; el.style.top=-(20+Math.random()*60)+'px'; el.style.animationDuration=(2+Math.random()*3)+'s';
            document.body.appendChild(el); setTimeout(()=>el.remove(),3500);
        },i*40);
    };

    Game.startTimer = function(){ if(this.timerInterval)clearInterval(this.timerInterval); this.timerInterval=setInterval(()=>{ if(!this.gameOver&&!this.winOverlayShown){ this.timerSeconds++; this.timerDisplay.textContent=formatTime(this.timerSeconds); } },1000); };
    Game.stopTimer = function(){ if(this.timerInterval){clearInterval(this.timerInterval); this.timerInterval=null;} };

    Game.updateCellSize = function(){ const w=this.board.clientWidth; this.cellSize=(w-20-3*10)/4; };

    Game.renderTiles = function(mergedPositions=[], scoreGained=0){
        this.updateCellSize(); const cellSize=this.cellSize; if(cellSize<=0) return;
        const container=this.tilesContainer, gap=10, newMap=new Map();
        for(let r=0;r<4;r++) for(let c=0;c<4;c++){ const t=this.grid[r][c]; if(t) newMap.set(t.id,{t,r,c}); }
        const toRemove=[]; this.tileElements.forEach((el,id)=>{ if(!newMap.has(id)) toRemove.push(id); });
        toRemove.forEach(id=>{ const el=this.tileElements.get(id); el.remove(); this.tileElements.delete(id); });
        newMap.forEach((info,id)=>{
            const {t, r, c}=info; let el=this.tileElements.get(id);
            if(!el){ el=document.createElement('div'); el.className='tile'; container.appendChild(el); this.tileElements.set(id,el); }
            el.className='tile'; if(t.isNew)el.classList.add('new'); if(t.merged)el.classList.add('merged');
            const style=getTileStyle(t.value);
            el.style.left=`${c*(cellSize+gap)}px`; el.style.top=`${r*(cellSize+gap)}px`;
            el.style.width=el.style.height=`${cellSize}px`; el.style.background=style.bg; el.style.color=style.color;
            el.style.fontSize=t.value>=1000?'1.6rem':t.value>=100?'1.9rem':'2.2rem'; el.textContent=t.value;
            t.isNew=false; t.merged=false;
        });
        if(scoreGained>0&&mergedPositions.length){
            const mid=mergedPositions[Math.floor(mergedPositions.length/2)];
            const pop=document.createElement('div'); pop.className='score-popup'; pop.textContent=`+${scoreGained}`;
            pop.style.left=`${mid.c*(cellSize+gap)+cellSize/2-24}px`; pop.style.top=`${mid.r*(cellSize+gap)-4}px`;
            container.appendChild(pop); setTimeout(()=>pop.remove(),800);
        }
        this.scoreDisplay.textContent=this.score; this.bestDisplay.textContent=this.bestScore;
    };

    Game.showOverlay = function(type){
        this.gameOverlay.classList.add('show');
        if(type==='win'){
            this.overlayTitle.textContent='Победа!'; this.overlayTitle.style.color='var(--accent2)';
            this.overlaySub.textContent=`Вы достигли 2048 за ${formatTime(this.timerSeconds)}`;
            this.overlayContinue.style.display='inline-block'; this.overlayClose.style.display='none';
            this.overlayRestart.textContent='Новая игра';
        }else{
            this.overlayTitle.textContent='Конец игры'; this.overlayTitle.style.color='var(--muted)';
            this.overlaySub.textContent=`Счёт: ${this.score} | Ходов: ${this.moves}`;
            this.overlayContinue.style.display='none'; this.overlayClose.style.display='inline-block';
            this.overlayRestart.textContent='Заново';
            if(!this.gameFinished) this.finishGame();
        }
    };

    Game.hideOverlay = function(){ this.gameOverlay.classList.remove('show'); this.winOverlayShown=false; if(!this.gameOver) this.startTimer(); };

    function isAnyOverlayOpen(){ return document.querySelector('.modal-overlay.show')!==null; }
    function openModal(id){ document.getElementById(id).classList.add('show'); Game.board.classList.add('blurred'); }
    function closeModal(id){ document.getElementById(id).classList.remove('show'); if(!isAnyOverlayOpen()) Game.board.classList.remove('blurred'); }

    Game.scheduleSave = function(){ if(this.saveTimeout)clearTimeout(this.saveTimeout); this.saveTimeout=setTimeout(()=>{ this.saveGameState(); this.saveTimeout=null; },1000); };
    Game.saveGameState = function(){
        const state={grid:this.grid.map(r=>r.map(t=>t?{id:t.id,value:t.value}:null)),score:this.score,moves:this.moves,timerSeconds:this.timerSeconds,gameOver:this.gameOver,gameWon:this.gameWon,winOverlayShown:this.winOverlayShown,gameFinished:this.gameFinished,tileIdCounter:this.tileIdCounter,dailyChallenge:this.dailyChallenge,dailyCompleted:this.dailyCompleted};
        localStorage.setItem('currentGame',JSON.stringify(state));
    };

    Game.loadGameState = function(){
        const saved=localStorage.getItem('currentGame'); if(!saved) return false;
        try{
            const st=JSON.parse(saved); this.tileElements.clear();
            this.grid=st.grid.map(r=>r.map(t=>t?{...t,isNew:false,merged:false}:null));
            this.score=st.score; this.moves=st.moves; this.timerSeconds=st.timerSeconds;
            this.gameOver=st.gameOver; this.gameWon=st.gameWon; this.winOverlayShown=st.winOverlayShown;
            this.gameFinished=st.gameFinished; this.tileIdCounter=st.tileIdCounter;
            this.dailyChallenge=st.dailyChallenge||null; this.dailyCompleted=st.dailyCompleted||false;
            this.timerDisplay.textContent=formatTime(this.timerSeconds);
            this.scoreDisplay.textContent=this.score; this.bestDisplay.textContent=this.bestScore;
            this.undoBtn.disabled=this.history.length===0;
            this.renderTiles();
            if(this.winOverlayShown) this.showOverlay('win');
            else if(this.gameOver) this.showOverlay('lose');
            else this.startTimer();
            return true;
        }catch(e){ return false; }
    };

    // Таблица лидеров только с рекордом пользователя
    Game.updateLeaderboard = function(){
        const best = parseInt(localStorage.getItem('best2048')||'0',10);
        this.leaderboard = [{name:'Вы', score:best}];
        localStorage.setItem('leaderboard2048', JSON.stringify(this.leaderboard));
    };

    Game.finishGame = function(){
        if(this.gameFinished) return;
        this.gameFinished=true;
        this.stats.games++; this.stats.totalScore+=this.score; this.stats.totalMoves+=this.moves; this.stats.totalTime+=this.timerSeconds;
        let maxTile=0; for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(this.grid[r][c]&&this.grid[r][c].value>maxTile) maxTile=this.grid[r][c].value;
        if(maxTile>this.stats.maxTile) this.stats.maxTile=maxTile;
        if(this.gameWon){ this.stats.wins++; if(this.stats.bestTime===null||this.timerSeconds<this.stats.bestTime) this.stats.bestTime=this.timerSeconds; }
        this.updateLeaderboard();
        localStorage.setItem('stats2048',JSON.stringify(this.stats));
        this.updateStatsDisplay(); this.checkNewAchievements(); this.renderAchievements(); this.saveGameState();
    };

    Game.newGame = function(){
        if(!this.gameFinished&&(this.score>0||this.moves>0)) this.finishGame();
        this.stopTimer();
        this.grid=Array.from({length:4},()=>Array(4).fill(null));
        this.score=0; this.moves=0; this.tileIdCounter=0; this.gameOver=false; this.gameWon=false;
        this.winOverlayShown=false; this.timerSeconds=0; this.history=[]; this.gameFinished=false;
        this.tileElements.clear(); this.undoBtn.disabled=true;
        this.timerDisplay.textContent='00:00'; this.scoreDisplay.textContent='0'; this.bestDisplay.textContent=this.bestScore;
        this.hideOverlay(); this.tilesContainer.innerHTML='';
        this.addRandomTile(); this.addRandomTile(); this.renderTiles(); this.startTimer();
        this.updateStatsDisplay(); this.renderAchievements(); this.saveGameState();
    };

    // Ежедневный вызов
    Game.getDailyChallenge = function(){
        const dayIndex = new Date().getDate() % dailyChallenges.length;
        return dailyChallenges[dayIndex];
    };

    Game.startDailyChallenge = function(){
        const challenge = this.getDailyChallenge();
        this.dailyChallenge = challenge;
        this.dailyCompleted = false;
        this.newGame();
        closeModal('dailyOverlay');
    };

    Game.renderDailyDescription = function(){
        const desc = document.getElementById('dailyDescription');
        const challenge = this.getDailyChallenge();
        desc.innerHTML = `<strong>${challenge.desc}</strong>`;
    };

    // Поделиться
    Game.shareToTelegram = function(){
        const best = this.bestScore || this.score;
        const text = encodeURIComponent(`Я набрал ${best} очков в 2048! Попробуй побить мой рекорд.`);
        window.open(`https://t.me/share/url?url=&text=${text}`, '_blank');
    };

    Game.showAchievementToast = function(name){
        const toast=document.getElementById('achievementToast'), text=document.getElementById('toastText');
        text.textContent=`Достижение разблокировано: ${name}`; toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'),3200);
    };

    Game.checkNewAchievements = function(){
        const newUnlocks=this.achievements.filter(a=>a.progress()>=a.target&&!this.unlockedAchievements.includes(a.id));
        newUnlocks.forEach(a=>{ this.unlockedAchievements.push(a.id); this.showAchievementToast(a.name); });
        if(newUnlocks.length){ localStorage.setItem('unlockedAchievements',JSON.stringify(this.unlockedAchievements)); this.renderAchievements(); }
    };

    Game.renderAchievements = function(){
        const container=document.getElementById('achievementsContainer'); container.innerHTML='';
        const grid=document.createElement('div'); grid.className='achievements-grid';
        this.achievements.forEach(a=>{
            const prog=Math.min(a.progress(),a.target), done=prog>=a.target;
            const cube=document.createElement('div'); cube.className='achievement-cube'+(done?'':' locked');
            cube.innerHTML=`<div class="cube-icon">${a.icon}</div><div class="cube-title">${a.name}</div><div class="achievement-progress"><div class="achievement-fill" style="width:${(prog/a.target)*100}%"></div></div>`;
            grid.appendChild(cube);
        });
        container.appendChild(grid);
    };

    Game.renderLeaderboard = function(){
        const list=document.getElementById('leaderboardList');
        list.innerHTML = this.leaderboard.length ? `<div class="leaderboard-item"><span class="leaderboard-rank">👑</span><span class="leaderboard-name">Рекорд</span><span class="leaderboard-score">${this.leaderboard[0].score}</span></div>` : '<div style="color:var(--muted);text-align:center;">Нет рекорда</div>';
    };

    Game.updateStatsDisplay = function(){
        document.getElementById('statGames').textContent=this.stats.games;
        document.getElementById('statWins').textContent=this.stats.wins;
        document.getElementById('statMaxTile').textContent=this.stats.maxTile||'-';
        document.getElementById('statTotalScore').textContent=this.stats.totalScore;
        document.getElementById('statTotalMoves').textContent=this.stats.totalMoves;
        document.getElementById('statBestTime').textContent=this.stats.bestTime?formatTime(this.stats.bestTime):'--:--';
    };

    Game.applyTheme = function(theme){
        if(theme==='light') document.body.classList.add('light-theme'); else document.body.classList.remove('light-theme');
        localStorage.setItem('theme',theme); this.renderTiles();
    };

    Game.init = function(){
        this.bestScore = parseInt(localStorage.getItem('best2048')||'0',10);
        try{ const s=JSON.parse(localStorage.getItem('stats2048')); if(s) Object.assign(this.stats,s); }catch(e){}
        this.updateLeaderboard();
        this.unlockedAchievements=JSON.parse(localStorage.getItem('unlockedAchievements')||'[]');
        const savedTheme=localStorage.getItem('theme')||'dark'; this.applyTheme(savedTheme);
        document.querySelectorAll('input[name="theme"]').forEach(r=>{ if(r.value===savedTheme) r.checked=true; r.addEventListener('change',e=>this.applyTheme(e.target.value)); });
        this.bindEvents();
        if(!this.loadGameState()) this.newGame();
        else{ this.updateStatsDisplay(); this.renderAchievements(); this.renderLeaderboard(); }
        this.checkNewAchievements();
    };

    Game.bindEvents = function(){
        document.addEventListener('keydown',e=>{
            if(isAnyOverlayOpen()) return;
            const dirMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
            if(dirMap[e.key]){ e.preventDefault(); this.move(dirMap[e.key]); }
            if(e.key==='z'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); if(this.popState()){ this.renderTiles(); this.undoBtn.disabled=this.history.length===0; if(this.gameOver&&!this.isGameOver()){this.gameOver=false; this.startTimer();} this.hideOverlay(); } }
        });
        let tsx,tsy; this.board.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
        this.board.addEventListener('touchend',e=>{ if(isAnyOverlayOpen()) return; const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy; if(Math.abs(dx)>25||Math.abs(dy)>25) this.move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); });
        let mdx,mdy,mdown=false; this.board.addEventListener('mousedown',e=>{mdown=true;mdx=e.clientX;mdy=e.clientY;e.preventDefault();});
        window.addEventListener('mouseup',e=>{ if(!mdown) return; mdown=false; if(isAnyOverlayOpen()) return; const dx=e.clientX-mdx,dy=e.clientY-mdy; if(Math.abs(dx)>25||Math.abs(dy)>25) this.move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); });
        this.newGameBtn.addEventListener('click',()=>this.newGame());
        this.undoBtn.addEventListener('click',()=>{ if(this.popState()){ this.renderTiles(); this.undoBtn.disabled=this.history.length===0; if(this.gameOver&&!this.isGameOver()){this.gameOver=false; this.startTimer();} this.hideOverlay(); } });
        this.overlayRestart.addEventListener('click',()=>this.newGame());
        this.overlayContinue.addEventListener('click',()=>{ this.hideOverlay(); this.winOverlayShown=false; });
        this.overlayClose.addEventListener('click',()=>this.hideOverlay());
        this.settingsBtn.addEventListener('click',()=>openModal('settingsOverlay'));
        document.querySelectorAll('.settings-item').forEach(item=>{
            item.addEventListener('click',()=>{
                const t=item.dataset.target; closeModal('settingsOverlay');
                if(t==='themes') openModal('themeOverlay');
                else if(t==='stats'){ this.updateStatsDisplay(); openModal('statsOverlay'); }
                else if(t==='achievements'){ this.renderAchievements(); openModal('achievementsOverlay'); }
                else if(t==='leaderboard'){ this.renderLeaderboard(); openModal('leaderboardOverlay'); }
                else if(t==='daily'){ this.renderDailyDescription(); openModal('dailyOverlay'); }
                else if(t==='share') openModal('shareOverlay');
            });
        });
        document.querySelectorAll('.modal-close').forEach(b=>b.addEventListener('click',e=>{ const ov=e.target.closest('.modal-overlay'); if(ov) closeModal(ov.id); }));
        ['themeOverlay','statsOverlay','achievementsOverlay','leaderboardOverlay','dailyOverlay','shareOverlay'].forEach(id=>{ const el=document.getElementById(id); el.addEventListener('click',e=>{if(e.target===el) closeModal(id);}); });
        document.getElementById('startDailyBtn').addEventListener('click',()=>this.startDailyChallenge());
        document.getElementById('shareTelegramBtn').addEventListener('click',()=>this.shareToTelegram());
        window.addEventListener('resize',()=>{ clearTimeout(this._resizeTimer); this._resizeTimer=setTimeout(()=>this.renderTiles(),120); });
        window.addEventListener('beforeunload',()=>{ if(!this.gameFinished&&(this.score>0||this.moves>0)) this.finishGame(); this.saveGameState(); });
    };

    Game.init();
    window.Game = Game;
})();
</script>
</body>
</html>
