    <style>

        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; }
        .app { width: 100%; max-width: 500px; height: 100dvh; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { font-size: 38px; font-weight: 900; letter-spacing: -1px; margin: 0; background: linear-gradient(45deg, var(--text), rgba(128,128,128,0.4)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .score-container { position: relative; }
        .score-box { background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 16px; display: flex; gap: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px var(--shadow); }
        .score-box span { color: var(--text); font-weight: 800; font-size: 16px; display: block; }
        .score-label { opacity: 0.6; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        
        .score-addition { position: absolute; top: -20px; left: 25px; transform: translateX(-50%); color: #22c55e; font-weight: 800; font-size: 18px; animation: floatUp 0.6s ease-out forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-25px); } }
        
        .btn { border: 1px solid var(--border); padding: 12px 16px; border-radius: 16px; background: var(--panel); color: var(--text); font-weight: 700; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px var(--shadow); }
        .btn:active { transform: scale(0.96); }
        
        .boardWrap { flex: 1; display: grid; place-items: center; min-height: 0; padding: 10px 0; position: relative; }
        .board {
            width: min(90vw, 85dvh, 460px); aspect-ratio: 1;
            background: var(--panel); border: 1px solid var(--border); border-radius: 24px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px var(--shadow); position: relative;
        }
        
        .grid-background { position: absolute; inset: 0; padding: 12px; display: grid; gap: 10px; z-index: 1; }
        .grid-cell { background: var(--empty); border-radius: 16px; }
        .tile-container { position: absolute; inset: 0; padding: 12px; z-index: 2; pointer-events: none; }

        .cell {
            position: absolute; display: flex; align-items: center; justify-content: center;
            font-weight: 800; border-radius: 16px; transition: transform 0.15s ease-out; will-change: transform;
            font-size: clamp(18px, 6vw, 36px);
        }
        .cell.tile { box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .cell.new-tile { animation: pop 0.2s ease-out forwards; }
        .cell.merged-tile { animation: pulse 0.15s ease-in-out forwards; }
        
        @keyframes pop {
            0% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
            100% { transform: translate(var(--x), var(--y)) scale(1); opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: translate(var(--x), var(--y)) scale(1); }
            50% { transform: translate(var(--x), var(--y)) scale(1.15); }
            100% { transform: translate(var(--x), var(--y)) scale(1); }
        }

        .overlay { position: absolute; inset: 12px; background: rgba(15,23,42,0.9); backdrop-filter: blur(8px); border-radius: 16px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 5; animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .overlay h2 { font-size: 32px; font-weight: 900; margin: 0; }

        .controls { display: none; grid-template-columns: repeat(3,1fr); gap: 10px; width: 100%; max-width: 260px; margin: 10px auto 0 auto; }
        .ctrl-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 16px; height: 54px; font-size: 22px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px var(--shadow); touch-action: manipulation; }
        .ctrl-btn:active { transform: scale(0.92); background: var(--empty); }

        /* Цветовые палитры для всех тем */
        body.dark .v2 { background: #334155; color: #f8fafc; } body.dark .v4 { background: #475569; color: #f8fafc; } body.dark .v8 { background: #f97316; color: #fff; } body.dark .v16 { background: #ea580c; color: #fff; } body.dark .v32 { background: #ef4444; color: #fff; } body.dark .v64 { background: #dc2626; color: #fff; } body.dark .v128 { background: #06b6d4; color: #0f172a; box-shadow: 0 0 12px rgba(6,182,212,0.4); } body.dark .v256 { background: #0ea5e9; color: #fff; box-shadow: 0 0 16px rgba(14,165,233,0.4); } body.dark .v512 { background: #3b82f6; color: #fff; box-shadow: 0 0 20px rgba(59,130,246,0.5); } body.dark .v1024 { background: #6366f1; color: #fff; } body.dark .v2048 { background: #a855f7; color: #fff; box-shadow: 0 0 25px #a855f7; }
        body.light .v2 { background: #cbd5e1; color: #1e293b; } body.light .v4 { background: #94a3b8; color: #f8fafc; } body.light .v8 { background: #ffedd5; color: #ea580c; } body.light .v16 { background: #fed7aa; color: #c2410c; } body.light .v32 { background: #fdba74; color: #9a3412; } body.light .v64 { background: #f97316; color: #fff; } body.light .v128 { background: #fca5a5; color: #991b1b; } body.light .v256 { background: #ef4444; color: #fff; } body.light .v512 { background: #93c5fd; color: #1e40af; } body.light .v1024 { background: #3b82f6; color: #fff; } body.light .v2048 { background: #fcd34d; color: #78350f; }
        body.ocean .v2 { background: #1e3a8a; color: #bfdbfe; } body.ocean .v4 { background: #1d4ed8; color: #fff; } body.ocean .v8 { background: #0369a1; color: #fff; } body.ocean .v16 { background: #0284c7; color: #fff; } body.ocean .v32 { background: #0ea5e9; color: #fff; } body.ocean .v64 { background: #38bdf8; color: #0b1528; } body.ocean .v128 { background: #0d9488; color: #fff; } body.ocean .v256 { background: #14b8a6; color: #fff; } body.ocean .v512 { background: #2dd4bf; color: #0b1528; } body.ocean .v1024 { background: #a7f3d0; color: #064e3b; } body.ocean .v2048 { background: #34d399; color: #064e3b; box-shadow: 0 0 20px #34d399; }
        body.sakura .v2 { background: #ffe4e6; color: #9f1239; } body.sakura .v4 { background: #fecdd3; color: #9f1239; } body.sakura .v8 { background: #fda4af; color: #fff; } body.sakura .v16 { background: #f43f5e; color: #fff; } body.sakura .v32 { background: #e11d48; color: #fff; } body.sakura .v64 { background: #be123c; color: #fff; } body.sakura .v128 { background: #f472b6; color: #fff; } body.sakura .v256 { background: #ec4899; color: #fff; } body.sakura .v512 { background: #db2777; color: #fff; } body.sakura .v1024 { background: #c084fc; color: #fff; } body.sakura .v2048 { background: #d946ef; color: #fff; box-shadow: 0 0 20px #d946ef; }
        body.neon .v2 { background: #00f5ff; color: #030008; box-shadow: 0 0 8px rgba(0,245,255,0.4); } body.neon .v4 { background: #00bfff; color: #fff; } body.neon .v8 { background: #7000ff; color: #fff; } body.neon .v16 { background: #bd00ff; color: #fff; } body.neon .v32 { background: #ff00b7; color: #fff; } body.neon .v64 { background: #ff0055; color: #fff; } body.neon .v128 { background: #ff3300; color: #fff; } body.neon .v256 { background: #ffaa00; color: #030008; } body.neon .v512 { background: #e7fe00; color: #030008; } body.neon .v1024 { background: #00ff66; color: #030008; } body.neon .v2048 { background: #fff; color: #030008; box-shadow: 0 0 25px #fff; }

        /* Всплывающие меню */
        .menu { position: fixed; inset: 0; display: none; background: rgba(3,7,18,0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 10; opacity:0; transition: opacity 0.25s ease; }
        .menu.open { display: flex; align-items: flex-end; justify-content: center; opacity:1; }
        .sheet { width: min(100vw, 440px); background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 28px 28px 0 0; max-height: 85dvh; overflow: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.3); transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.16,1,0.3,1); }
        body.light .sheet { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.06); }
        .menu.open .sheet { transform: translateY(0); }
        .tab-nav { display: flex; gap: 6px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 12px 6px; border: 1px solid var(--border); background: var(--empty); color: var(--text); border-radius: 14px; font-weight: 600; font-size: 12px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: var(--panel); border-color: #38bdf8; color: #38bdf8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); }
        .section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity:0.5; margin-bottom: 8px; }
        .grid-opts { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
        .grid-opts.themes { grid-template-columns: repeat(2,1fr); }
        .opt { width: 100%; padding: 10px 6px; border: 1px solid var(--border); border-radius: 12px; background: var(--empty); color: var(--text); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .opt:active { background: var(--panel); transform: scale(0.97); }
        .opt-wide { grid-column: span 3; background: var(--panel); font-weight: 700; font-size: 14px; padding: 12px; color: #38bdf8; margin-top: 6px; }
        .opt-danger { color: #ef4444 !important; }
        .opt-share { color: #22c55e !important; }
        .opt-leader { color: #eab308 !important; }
        .toggle-box { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--empty); padding: 10px 14px; border-radius: 14px; border: 1px solid var(--border); font-weight: 600; font-size: 13px; margin-bottom: 6px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity:0; width:0; height:0; }
        .slider { position: absolute; cursor: pointer; inset:0; background-color: rgba(128,128,128,0.3); transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(18px); }
        .close-btn { background: none; border:0; color: var(--text); font-size:18px; opacity:0.5; cursor: pointer; padding: 4px; }
        .leader-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .leader-item { display: flex; justify-content: space-between; align-items: center; background: var(--empty); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); font-weight: 600; font-size: 13px; }
        .leader-name { display: flex; align-items: center; gap: 8px; }
        .leader-rank { font-weight: 800; color: #eab308; width: 18px; }
        .leader-score { font-weight: 800; color: #38bdf8; }
        .achievement-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .achievement { background: var(--empty); padding: 10px; border-radius: 12px; border: 1px solid var(--border); text-align: center; font-size: 11px; opacity: 0.4; }
        .achievement.earned { background: rgba(34,197,94,0.15); border-color: #22c55e; opacity: 1; }
        .achievement .icon { font-size: 20px; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(34,197,94,0.95); color: white; padding: 10px 20px; border-radius: 20px; font-weight: 600; z-index: 100; opacity:0; transition: opacity 0.3s; pointer-events:none; }
        .toast.show { opacity:1; }
    </style>
</head>
<body class="dark">
<div class="app">
    <div class="top">
        <h1>2048</h1>
        <div style="display:flex; gap:8px; align-items:center;">
            <div class="score-container">
                <div class="score-box">
                    <div><div class="score-label">Счет</div><span id="score">0</span></div>
                    <div style="border-left:1px solid var(--border); padding-left:12px;"><div class="score-label">Рекорд</div><span id="best">0</span></div>
                </div>
                <div id="scoreAdditionContainer"></div>
            </div>
            <button class="btn" onclick="openMenu('mainMenu')" title="Настройки">⚙️</button>
        </div>
    </div>
    <div class="boardWrap">
        <div id="board" class="board">
            <div id="gridBackground" class="grid-background"></div>
            <div id="tileContainer" class="tile-container"></div>
        </div>
        <div id="gameOverOverlay" class="overlay">
            <h2 id="overlayTitle">Игра окончена!</h2>
            <div id="resultCardContainer"></div>
            <button class="btn" style="padding:16px 32px;" onclick="start()">Играть снова 🔄</button>
        </div>
    </div>
    <div id="keyboardControls" class="controls">
        <div></div><button class="ctrl-btn" onclick="move('u')">▲</button><div></div>
        <button class="ctrl-btn" onclick="move('l')">◀</button><button class="ctrl-btn" onclick="move('d')">▼</button><button class="ctrl-btn" onclick="move('r')">▶</button>
    </div>
    <div id="toast" class="toast">Ссылка скопирована!</div>
</div>

<div id="mainMenu" class="menu" onclick="closeMenu(event, 'mainMenu')">
    <div class="sheet">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h2 style="margin:0; font-size:20px;">Настройки</h2>
            <button class="close-btn" onclick="closeMenu(null, 'mainMenu', true)">✕</button>
        </div>
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="game">🎮 Игра</button>
            <button class="tab-btn" data-tab="ghost">⚔️ Дуэли</button>
            <button class="tab-btn" data-tab="themes">🎨 Темы</button>
            <button class="tab-btn" data-tab="stats">📊 Статы</button>
        </div>
        
        <div class="tab-content active" id="tab-game">
            <div style="display:flex; gap:6px; margin-bottom:12px;">
                <button class="opt opt-wide opt-share" style="margin:0;" onclick="start(); closeMenu(null,'mainMenu',true)">🔄 Начать заново</button>
                <button class="opt opt-wide" style="margin:0; color:var(--text);" onclick="undo(); closeMenu(null,'mainMenu',true)">↩️ Отмена хода</button>
            </div>
            <div class="section">
                <div class="section-title">📐 Размер поля</div>
                <div class="grid-opts">
                    <button class="opt" id="opt-sz4" onclick="changeSize(4)">4×4</button>
                    <button class="opt" id="opt-sz5" onclick="changeSize(5)">5×5</button>
                    <button class="opt" id="opt-sz6" onclick="changeSize(6)">6×6</button>
                </div>
            </div>
            <div class="section">
                <div class="section-title">🎮 Управление</div>
                <div class="toggle-box"><span>Кнопки на экране</span><label class="switch"><input type="checkbox" id="btnToggle" onchange="toggleButtons(this.checked)"><span class="slider"></span></label></div>
            </div>
        </div>
        
        <div class="tab-content" id="tab-ghost">
            <button class="opt opt-wide" onclick="showDailyChallenge()">📅 Ежедневный Вызов</button>
            <div style="display:flex; gap:6px; margin:8px 0;">
                <button class="opt opt-share" style="flex:1" onclick="challengeFriend()">⚔️ Вызвать друга</button>
                <button class="opt opt-share" style="flex:1" onclick="copyChallengeLink()">📋 Копировать ссылку</button>
            </div>
            <button class="opt opt-wide opt-leader" onclick="openLeaderboard()">🥇 Таблица лидеров</button>
            <button class="opt opt-wide opt-share" onclick="shareResult()">🚀 Поделиться рекордом</button>
        </div>
        
        <div class="tab-content" id="tab-themes">
            <div class="grid-opts themes">
                <button class="opt" onclick="theme('dark')">🌙 Dark</button>
                <button class="opt" onclick="theme('light')">☀️ Light</button>
                <button class="opt" onclick="theme('ocean')">🌊 Ocean</button>
                <button class="opt" onclick="theme('sakura')">🌸 Sakura</button>
                <button class="opt" onclick="theme('neon')">⚡ Neon</button>
            </div>
        </div>
        
        <div class="tab-content" id="tab-stats">
            <div id="statsContainer" class="toggle-box" style="flex-direction:column; align-items:flex-start; gap:4px; background:transparent; border:none; padding:0;"></div>
            <div class="section">
                <div id="achievementsContainer" class="achievement-grid"></div>
            </div>
        </div>
    </div>
</div>

<div id="leaderMenu" class="menu" onclick="closeMenu(event, 'leaderMenu')">
    <div class="sheet">
        <div style="display:flex; justify-content:space-between;"><h2>Топ игроков</h2><button class="close-btn" onclick="closeMenu(null,'leaderMenu',true)">✕</button></div>
        <div id="leaderboardContent" class="leader-list"></div>
    </div>
</div>

<div id="dailyChallengeMenu" class="menu" onclick="closeMenu(event, 'dailyChallengeMenu')">
    <div class="sheet">
        <div style="display:flex; justify-content:space-between;"><h2>Ежедневный хардкор-вызов</h2><button class="close-btn" onclick="closeMenu(null,'dailyChallengeMenu',true)">✕</button></div>
        <p style="margin:6px 0; font-size:14px; opacity:0.8;">Модификатор: <b id="dailyModifierDesc" style="color:#ef4444;"></b></p>
        <p style="font-size:13px; opacity:0.6;">Seed дня: <span id="dailySeedDisplay"></span></p>
        <button class="opt opt-wide" onclick="startDailyChallenge()">🎯 Начать испытание</button>
    </div>
</div>

<script>
    // ==========================================
    // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И НАСТРОЙКИ ИГРЫ
    // ==========================================
    let size = 4;                 
    let scoreV = 0;               
    let bestV = 0;                
    let g = [];                   
    let historyStack = [];        
    let idCounter = 1;            
    let gameOver = false;         
    let winShown = false;         
    let currentSeed = null;       
    let movesLog = [];        
    let rivalScore = null;        
    let totalMovesCount = 0;      
    let isTimerRunning = false;   
    let timerIntervalId = null;   
    let currentRng = null;        
    let gameTime = 0; 
    
    let stats = { gamesPlayed: 0, wins: 0, totalScore: 0, bestTile: 0 };

    // ==========================================
    // СПИСОК ИЗ 21 ДОСТИЖЕНИЯ

    const LS = {
        get(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch(e) { return def; } },
        set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
    };

    function mulberry32(a) { 
        return function() { 
            let t = a += 0x6D2B79F5; 
            t = Math.imul(t ^ t >>> 15, t | 1); 
            t ^= t + Math.imul(t ^ t >>> 7, t | 61); 
            return ((t ^ t >>> 14) >>> 0) / 4294967296; 
        } 
    }

    function getDailySeed() {
        const d = new Date();
        return (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) * 77;
    }

    function getDailyModifierInfo() {
        const day = new Date().getDay(); 
        switch(day) {
            case 1: return { desc: "Чистая четверка (Все новые плитки появляются сразу равными 4!)", only4: true, badChance: false };
            case 3: return { desc: "Проклятие дебаффа (Плитки генерируются преимущественно в самых заполненных углах)", only4: false, badChance: true };
            case 5: return { desc: "Супер хардкор (Только плитки 4 и уменьшенное поле 4х4 без права на ошибку)", only4: true, badChance: true };
            default: return { desc: "Плотный спавн (Шанс появления плитки 4 увеличен до 40%)", only4: false, customChance: 0.4 };
        }
    }

    function generateGridFromSeed(sz) {
        const grid = Array(sz).fill().map(() => Array(sz).fill(0));
        let idCtr = 1;
        const mod = getDailyModifierInfo();

        for (let i = 0; i < 2; i++) {
            const empty = [];
            for (let y = 0; y < sz; y++) for (let x = 0; x < sz; x++) if (!grid[y][x]) empty.push([y,x]);
            if (!empty.length) break;
            
            let idx = Math.floor(currentRng() * empty.length);
            if (currentSeed === getDailySeed() && mod.badChance) { idx = empty.length - 1; }
            
            const [y,x] = empty[idx];
            let val = currentRng() < 0.9 ? 2 : 4;
            if (currentSeed === getDailySeed() && mod.only4) val = 4;
            if (currentSeed === getDailySeed() && mod.customChance && currentRng() < mod.customChance) val = 4;

            grid[y][x] = { id: idCtr++, value: val, merged: false, isNew: true };
        }
        idCounter = idCtr;
        return grid;
    }

    function formatTime(totalSeconds) {
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function add() {
        const f = [];
        for(let y=0; y<size; y++) for(let x=0; x<size; x++) if(!g[y][x]) f.push([y,x]);
        if(!f.length) return;
        
        if (f.length <= 2) earnAchievement('closeCall');

        let idx = Math.floor(currentRng() * f.length);
        const mod = getDailyModifierInfo();
        if (currentSeed === getDailySeed() && mod.badChance) { idx = f.length - 1; }
        
        const [y,x] = f[idx];
        let val = currentRng() < .9 ? 2 : 4;
        if (currentSeed === getDailySeed() && mod.only4) val = 4;
        if (currentSeed === getDailySeed() && mod.customChance && currentRng() < mod.customChance) val = 4;
        
        g[y][x] = { id: idCounter++, value: val, merged: false, isNew: true }; currentSeed++;
    }

    function slideRow(row, tracker) {
        let items = row.filter(x => x !== 0);
        let result = [];
        for (let i = 0; i < items.length; i++) {
            if (i < items.length - 1 && items[i].value === items[i+1].value) {
                let mergedValue = items[i].value * 2;
                scoreV += mergedValue;
                tracker.added += mergedValue;
                result.push({ id: items[i].id, value: mergedValue, merged: true, isNew: false });
                i++;
            } else {
                result.push({ id: items[i].id, value: items[i].value, merged: false, isNew: false });
            }
        }
        while (result.length < size) result.push(0);
        return result;
    }

    function move(d) {
        if(gameOver) return;
        
        historyStack.push({ 
            grid: JSON.parse(JSON.stringify(g)), 
            score: scoreV,
            idCounter: idCounter,
            gameTime: gameTime
        });
        if(historyStack.length > 30) historyStack.shift();
        
        let tracker = { added: 0 };
        let oldStr = JSON.stringify(g.map(r => r.map(c => c ? c.value : 0)));
        
        for(let y=0; y<size; y++) for(let x=0; x<size; x++) if(g[y][x]) { g[y][x].isNew = false; g[y][x].merged = false; }

        if (d === 'l') g = g.map(r => slideRow(r, tracker));
        if (d === 'r') g = g.map(r => slideRow([...r].reverse(), tracker).reverse());
        if (d === 'u' || d === 'd') {
            for (let x = 0; x < size; x++) {
                let col = g.map(r => r[x]);
                if (d === 'd') col.reverse(); col = slideRow(col, tracker); if (d === 'd') col.reverse();
                for (let y = 0; y < size; y++) g[y][x] = col[y];
            }
        }

        let newStr = JSON.stringify(g.map(r => r.map(c => c ? c.value : 0)));
        if (oldStr !== newStr) {
            movesLog.push(d);
            totalMovesCount++;
            
            if (totalMovesCount === 1) earnAchievement('firstMove');
            if (totalMovesCount === 77) earnAchievement('lucky77');
            if (tracker.added > 0) showScoreAddition(tracker.added);
            
            add(); updateScore(); render(); checkGameState(); checkAchievements(); saveGame();
        } else {
            historyStack.pop();
        }
    }

    function showScoreAddition(amount) {
        const cont = document.getElementById('scoreAdditionContainer');
        if(!cont) return; cont.innerHTML = '';
        const el = document.createElement('div'); el.className = 'score-addition'; el.textContent = `+${amount}`; cont.appendChild(el);
    }

    function undo() {
        if(gameOver || !historyStack.length) return;
        const prev = historyStack.pop();
        g = prev.grid; scoreV = prev.score; idCounter = prev.idCounter; gameTime = prev.gameTime || gameTime;
        movesLog.pop(); if(totalMovesCount > 0) totalMovesCount--;
        
        earnAchievement('timeTraveler');
        
        updateScore(); render(); checkGameState(); saveGame();
        showToast('Ход отменен! ↩️');
    }

    function checkGameState() {
        let hasTarget = false;
        for(let y=0; y<size; y++) for(let x=0; x<size; x++) {
            if(g[y][x] && g[y][x].value >= 2048) hasTarget = true;
            if(g[y][x] && g[y][x].value > stats.bestTile) stats.bestTile = g[y][x].value;
        }
        if(hasTarget && !winShown) {
            winShown = true; overlayTitle.textContent = 'Вы победили! 🎉';
            overlay.style.display = 'flex';
            overlay.classList.add('open');
            gameOver = true;
            stats.wins++; endGame(); return;
        }

        let movesPossible = false;
        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                if (!g[y][x]) { movesPossible = true; break; }
                if (x < size - 1 && g[y][x + 1] && g[y][x].value === g[y][x + 1].value) { movesPossible = true; break; }
                if (y < size - 1 && g[y + 1][x] && g[y][x].value === g[y + 1][x].value) { movesPossible = true; break; }
            }
            if (movesPossible) break;
        }

        if (!movesPossible) {
            overlayTitle.textContent = 'Игра окончена! 💀';
            gameOver = true;
            triggerGameOverVisuals();
            endGame();
        }
    }

    function endGame() {
        stopTimer();

    function checkAchievements() {
        let maxTile = 0;
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (g[y][x]) maxTile = Math.max(maxTile, g[y][x].value);

        if (scoreV >= 1000 && !achievements.score1000.earned) earnAchievement('score1000');
        if (scoreV >= 5000 && !achievements.score5000.earned) earnAchievement('score5000');
        if (scoreV >= 10000 && !achievements.score10000.earned) earnAchievement('score10000');
        if (scoreV >= 50000 && !achievements.score50000.earned) earnAchievement('score50000');
        
        if (maxTile >= 64 && !achievements.tile64.earned) earnAchievement('tile64');
        if (maxTile >= 256 && !achievements.tile256.earned) earnAchievement('tile256');
        if (maxTile >= 512 && !achievements.tile512.earned) earnAchievement('tile512');
        if (maxTile >= 1024 && !achievements.tile1024.earned) earnAchievement('tile1024');
        if (maxTile >= 2048 && !achievements.tile2048.earned) earnAchievement('tile2048');
        
        if (maxTile >= 2048 && gameTime < 120 && !achievements.speedrun.earned) earnAchievement('speedrun');
        if (totalMovesCount >= 500 && !achievements.tactician.earned) earnAchievement('tactician');
        if (size === 6 && !achievements.giantBoard.earned) earnAchievement('giantBoard');
        if (size === 3 && !achievements.smallBoard.earned) earnAchievement('smallBoard');
    }

    function earnAchievement(id) {
        if (!achievements[id] || achievements[id].earned) return;
        achievements[id].earned = true;
        LS.set('achievements2048', achievements);

        stats = LS.get('stats2048', stats);

        if (savedAch) {
            for (const id in savedAch) if (achievements[id]) achievements[id].earned = savedAch[id].earned;

    function renderStats() {
        const c = document.getElementById('statsContainer');

        c.innerHTML = `

    function updateScore() {
        scoreEl.textContent = scoreV;
        if (scoreV > bestV) { bestV = scoreV; localStorage.bestScore = bestV; }
        bestEl.textContent = bestV;
    }

    function buildGridBackground() {
        gridBackgroundEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        gridBackgroundEl.innerHTML = '';
        for (let i = 0; i < size * size; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            gridBackgroundEl.appendChild(cell);
        }
    }

    function render() {
        tileContainerEl.innerHTML = '';
        const boardW = boardEl.clientWidth - 24; 
        const gap = 10;
        const cellSize = (boardW - (size - 1) * gap) / size;

        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                const cell = g[y][x];
                if (!cell) continue;

                const el = document.createElement('div');
                const xPos = x * (cellSize + gap);
                const yPos = y * (cellSize + gap);

                el.className = `cell tile v${cell.value}`;
                if (cell.isNew) el.classList.add('new-tile');
                if (cell.merged) el.classList.add('merged-tile');

                el.textContent = cell.value;
                el.style.width = `${cellSize}px`;
                el.style.height = `${cellSize}px`;
                el.style.setProperty('--x', `${xPos}px`);
                el.style.setProperty('--y', `${yPos}px`);
                el.style.transform = `translate(${xPos}px, ${yPos}px)`;

                tileContainerEl.appendChild(el);
            }
        }
    }

    window.addEventListener('resize', render);

    function start() {
        if (totalMovesCount > 0 && !gameOver) earnAchievement('cleanSlate');

        gameOver = false; winShown = false; scoreV = 0; totalMovesCount = 0; movesLog = [];
        gameTime = 0; 
        overlay.style.display = 'none';
        overlay.classList.remove('open'); 
        historyStack = [];
        
        if (!currentSeed) currentSeed = Math.floor(Math.random() * 9999999);
        currentRng = mulberry32(currentSeed);

        stats.gamesPlayed++;
        saveStats();

        buildGridBackground();
        g = generateGridFromSeed(size);
        updateScore();
        render();
        startTimer(); 
    }

    function saveGame() {
        localStorage.savedGame = JSON.stringify({ g, size, scoreV, idCounter, gameOver, winShown, currentSeed, movesLog, rivalScore, gameTime });
    }

        if (!document.querySelector('.tab-btn[data-tab="achievements"]')) {
            const firstTabBtn = mainMenu.querySelector('.tab-btn');
            if (firstTabBtn && firstTabBtn.parentElement) {
                const achBtn = document.createElement('button');
                achBtn.className = 'tab-btn';
                achBtn.setAttribute('data-tab', 'achievements');
                achBtn.innerHTML = '🏆 Ачивки';
                achBtn.addEventListener('click', () => switchTab('achievements'));
                firstTabBtn.parentElement.appendChild(achBtn);
            }
        }

        // 2. Находим контейнер для контента табов (.tab-content) и внедряем наш шаблон
        if (!document.getElementById('tab-achievements')) {
            const firstTabContent = mainMenu.querySelector('.tab-content');
            if (firstTabContent && firstTabContent.parentElement) {
                const achContent = document.createElement('div');
                achContent.id = 'tab-achievements';
                achContent.className = 'tab-content';
                achContent.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin: 4px 0; font-size:12px; color:var(--text); font-weight:bold;">
                        <span>Прогресс:</span>
                        <span><b id="achUnlockedCount">0</b>/21</span>
                    </div>
                    <div class="ach-progress-bar"><div id="achProgressFill" class="ach-progress-fill"></div></div>
                    <div id="achievementsGridContainer" class="ach-menu-grid"></div>
                `;
                firstTabContent.parentElement.appendChild(achContent);
            }
        }
    }

    function renderAchievementsTab() {
        earnAchievement('hoarder'); 
        const grid = document.getElementById('achievementsGridContainer');
        if (!grid) return;
        
        grid.innerHTML = '';
        let unlocked = 0;
        let total = 0;

        for (const id in achievements) {
            total++;
            const a = achievements[id];
            if (a.earned) unlocked++;

            const card = document.createElement('div');
            card.className = `ach-item-card ${a.earned ? 'earned' : ''}`;
            card.innerHTML = `
                <div class="ach-card-icon">${a.icon}</div>
                <div class="ach-card-name">${a.name}</div>
                <div class="ach-card-desc">${a.desc}</div>
            `;
            grid.appendChild(card);
        }

        const countEl = document.getElementById('achUnlockedCount');
        const fillEl = document.getElementById('achProgressFill');
        if (countEl) countEl.textContent = unlocked;
        if (fillEl) {
            const percent = (unlocked / total) * 100;
            fillEl.style.width = `${percent}%`;
        }
    }

    function loadGame() {
        const saved = localStorage.savedGame ? JSON.parse(localStorage.savedGame) : null;
        size = parseInt(localStorage.gridSize) || 4;
        bestV = parseInt(localStorage.bestScore) || 0;
        theme(localStorage.theme || 'dark');
        toggleButtons(localStorage.showButtons === '1');

        loadStats();
        initAchievementsUI(); 
        renderStats();

        const urlParams = new URLSearchParams(window.location.search);
        const shareSeed = urlParams.get('seed');
        const shareScore = urlParams.get('score');
        const shareSize = urlParams.get('size');

        if (shareSeed && shareScore) {
            currentSeed = parseInt(shareSeed);
            rivalScore = parseInt(shareScore);
            size = parseInt(shareSize) || 4;
            localStorage.gridSize = size;
            showToast('⚔️ Вызов принят! Побейте счет друга.');
            start();
            return;
        }

        if (saved && saved.size === size && !saved.gameOver) {
            g = saved.g; scoreV = saved.scoreV; idCounter = saved.idCounter;
            gameOver = saved.gameOver; winShown = saved.winShown;
            currentSeed = saved.currentSeed; movesLog = saved.movesLog || [];
            rivalScore = saved.rivalScore ?? null;
            gameTime = saved.gameTime || 0;
            currentRng = mulberry32(currentSeed);
            buildGridBackground(); updateScore(); render(); startTimer();
        } else {
            currentSeed = null; rivalScore = null;
            start();
        }
    }

    function showDailyChallenge() {
        closeMenu(null, 'mainMenu', true);
        const menuEl = document.getElementById('dailyChallengeMenu');
        const info = getDailyModifierInfo();
        document.getElementById('dailyModifierDesc').textContent = info.desc;
        document.getElementById('dailySeedDisplay').textContent = getDailySeed();
        
        menuEl.style.display = 'flex';
        setTimeout(() => menuEl.classList.add('open'), 10);
    }

    function startDailyChallenge() {
        closeMenu(null, 'dailyChallengeMenu', true);
        currentSeed = getDailySeed();
        rivalScore = null;
        
        earnAchievement('dailyDone');

        if (new Date().getDay() === 5) { size = 4; } 
        localStorage.gridSize = size;
        
        showToast('🎯 Хардкор-испытание началось!');
        start();
    }

    function getChallengeLink() {
        const base = window.location.origin + window.location.pathname;
        return `${base}?seed=${currentSeed}&score=${scoreV}&size=${size}`;
    }

    function copyChallengeLink() {
        navigator.clipboard.writeText(getChallengeLink()).then(() => showToast('📋 Ссылка скопирована!'));
    }

    function challengeFriend() {
        const link = getChallengeLink();
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Побей мой рекорд в 2048 Duel! ⚔️')}`);
        } else {
            copyChallengeLink();
        }
    }

    function shareResult() {
        const text = `Я набрал ${scoreV} очков на поле ${size}×${size} в 2048 Duel! Сможешь лучше? 🚀`;
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(window.location.origin)}&text=${encodeURIComponent(text)}`);
        } else {
            showToast('🚀 Результат готов к отправке!');
        }
    }

    function openLeaderboard() {
        closeMenu(null, 'mainMenu', true);
        const menuEl = document.getElementById('leaderMenu');
        const listEl = document.getElementById('leaderboardContent');
        listEl.innerHTML = '';

        let leaders = botNames.map((name, i) => ({
            name, score: Math.floor(mulberry32(105 + i)() * 35000) + 2048, rank: 0
        }));
        leaders.push({ name: "Вы (Вызов)", score: scoreV, isPlayer: true });
        leaders.sort((a, b) => b.score - a.score);

        leaders.forEach((l, idx) => {
            const el = document.createElement('div');
            el.className = 'leader-item';
            if (l.isPlayer) el.style.borderColor = '#38bdf8';
            el.innerHTML = `
                <div class="leader-name"><span class="leader-rank">#${idx+1}</span>${l.name}</div>
                <div class="leader-score">${l.score}</div>`;
            listEl.appendChild(el);
        });

        menuEl.style.display = 'flex';
        setTimeout(() => menuEl.classList.add('open'), 10);
    }

    function openMenu(id) {
        const m = document.getElementById(id);
        if (!m) return;
        m.style.display = 'flex';
        setTimeout(() => m.classList.add('open'), 10);
        if (id === 'mainMenu') switchTab('game');
    }

    function closeMenu(e, id, force = false) {
        const m = document.getElementById(id);
        if (m && (force || e.target === m)) {
            m.classList.remove('open');
            setTimeout(() => m.style.display = 'none', 250);
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.toggle('active', b.getAttribute('data-tab') === tabId);
        });
        document.querySelectorAll('.tab-content').forEach(c => {
            c.classList.toggle('active', c.id === `tab-${tabId}`);
        });
        if (tabId === 'stats') renderStats();
        if (tabId === 'achievements') renderAchievementsTab();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
    });

    // ==========================================
    // ОБРАБОТЧИКИ СВАЙПОВ И КЛАВИШ
    // ==========================================
    window.addEventListener('keydown', e => {
        if (['ArrowUp', 'KeyW'].includes(e.code)) { move('u'); e.preventDefault(); }
        if (['ArrowDown', 'KeyS'].includes(e.code)) { move('d'); e.preventDefault(); }
        if (['ArrowLeft', 'KeyA'].includes(e.code)) { move('l'); e.preventDefault(); }
        if (['ArrowRight', 'KeyD'].includes(e.code)) { move('r'); e.preventDefault(); }
    }, { passive: false });

    let tsX = null, tsY = null;
    window.addEventListener('touchstart', e => {
        tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', e => {
        if (!tsX || !tsY) return;
        let tdX = e.touches[0].clientX - tsX, tdY = e.touches[0].clientY - tsY;
        if (Math.max(Math.abs(tdX), Math.abs(tdY)) > 40) {
            if (Math.abs(tdX) > Math.abs(tdY)) {
                move(tdX > 0 ? 'r' : 'l');
            } else {
                move(tdY > 0 ? 'd' : 'u');
            }
            tsX = null; tsY = null;
        }
    }, { passive: true });

    window.onload = loadGame;
</script>
</body>
</html>
