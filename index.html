    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;

            --bg-card: #1e293b;
            --t2: #e2e8f0; --t4: #cbd5e1; --t8: #f97316; --t16: #ea580c; --t32: #ef4444; --t64: #dc2626;
            --t128: #eab308; --t256: #ca8a04; --t512: #a855f7; --t1024: #9333ea; --t2048: #ec4899; --t4096: #db2777;
        }
        body.light {
            --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --primary: #4f46e5; --primary-hover: #4338ca;
            --border: #cbd5e1; --grid-bg: #e2e8f0; --cell-bg: #cbd5e1; --bg-card: #f1f5f9;
            --t2: #0f172a; --t4: #1e293b;
        }
        body.cyberpunk {
            --bg: #780016; --surface: #000000; --text: #00ff66; --primary: #ff0055; --primary-hover: #cc0044;
            --border: #ff0055; --grid-bg: #1a0005; --cell-bg: #2a000a; --bg-card: #110003;
            --t2: #00ff66; --t4: #00ffff; --t8: #ffff00; --t16: #ff00ff; --t32: #ff9900; --t64: #ff0055;
            --t128: #00ff66; --t256: #00ffff; --t512: #ffff00; --t1024: #ff00ff; --t2048: #ff9900; --t4096: #ff0055;
        }
        body.matrix {
            --bg: #000000; --surface: #050505; --text: #00ff00; --primary: #008800; --primary-hover: #00aa00;
            --border: #00ff00; --grid-bg: #020202; --cell-bg: #080808; --bg-card: #030303;
            --t2: #00ff00; --t4: #00ff00; --t8: #00ff00; --t16: #00ff00; --t32: #00ff00; --t64: #00ff00;
            --t128: #00ff00; --t256: #00ff00; --t512: #00ff00; --t1024: #00ff00; --t2048: #00ff00; --t4096: #00ff00;
        }
        body.neon {
            --bg: #03001e; --surface: #7303c0; --text: #fdeff9; --primary: #ec38bc; --primary-hover: #f355ce;
            --border: #ec38bc; --grid-bg: #03001e; --cell-bg: #1f003a; --bg-card: #150029;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow-x: hidden; padding-bottom: 20px;
        }
        .header {
            width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; padding: 15px 10px 5px;
        }
        .title-area h1 { font-size: 26px; margin: 0; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(45deg, var(--primary), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .title-area p { margin: 2px 0 0; font-size: 12px; opacity: 0.6; }
        .score-container { display: flex; gap: 8px; }
        .score-box { background: var(--surface); border: 1px solid var(--border); padding: 6px 14px; border-radius: 12px; text-align: center; min-width: 75px; position: relative; }
        .score-box label { font-size: 9px; text-transform: uppercase; opacity: 0.5; display: block; font-weight: 700; letter-spacing: 0.5px; }
        .score-box span { font-size: 18px; font-weight: 700; }
        #scoreAdditionContainer { position: absolute; top: -15px; left: 0; width: 100%; text-align: center; pointer-events: none; }
        .score-addition { color: #10b981; font-weight: 700; font-size: 14px; animation: floatUp .6s ease-out forwards; }
        @keyframes floatUp { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-20px); } }
        
        .toolbar { width: 100%; max-width: 420px; display: flex; justify-content: space-between; padding: 5px 10px; gap: 8px; }
        .btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }

        .board-wrapper { width: 100%; max-width: 420px; padding: 0 10px; margin-top: 5px; }
        #board {
            width: 100%; aspect-ratio: 1; background: var(--grid-bg); border: 2px solid var(--border); border-radius: 16px; position: relative; padding: 12px; overflow: hidden; touch-action: none;
            display: grid; gap: 10px;
        }
        .cell {
            background: var(--cell-bg); border-radius: 10px; width: 100%; height: 100%; position: absolute;
            display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800;
            transition: top 0.15s ease, left 0.15s ease, transform 0.1s ease; will-change: top, left, transform;
        }
        .tile { z-index: 2; color: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .new-tile { animation: scaleUp 0.2s ease-out forwards; }
        @keyframes scaleUp { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Цвета плиток */
        .v2 { background: var(--t2); color: #1e293b; } body.dark .v2, body.matrix .v2, body.cyberpunk .v2 { color: var(--bg); }
        .v4 { background: var(--t4); color: #1e293b; } body.dark .v4, body.matrix .v4, body.cyberpunk .v4 { color: var(--bg); }
        .v8 { background: var(--t8); } .v16 { background: var(--t16); } .v32 { background: var(--t32); } .v64 { background: var(--t64); }
        .v128 { background: var(--t128); font-size: 20px; } .v256 { background: var(--t256); font-size: 20px; }
        .v512 { background: var(--t512); font-size: 20px; } .v1024 { background: var(--t1024); font-size: 16px; }
        .v2048 { background: var(--t2048); font-size: 16px; box-shadow: 0 0 12px var(--t2048); }
        .v4096 { background: var(--t4096); font-size: 16px; box-shadow: 0 0 16px var(--t4096); }

        /* Стилизация призрака */
        .cell.ghost {
            background: rgba(168, 85, 247, 0.2) !important;
            border: 2px dashed #a855f7 !important;
            animation: pulseGhost 1.5s infinite ease-in-out;
            z-index: 1;
        }
        @keyframes pulseGhost { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

        /* Экранные меню и оверлеи */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.85); backdrop-filter: blur(8px); z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .menu-modal {
            background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 360px; border-radius: 20px; padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 12px;
            transform: translateY(50px); opacity: 0; transition: transform 0.25s cubic-bezier(0.1, 1, 0.1, 1), opacity 0.25s;
        }
        .overlay.open .menu-modal { transform: translateY(0); opacity: 1; }
        .menu-title { font-size: 20px; font-weight: 800; margin: 0 0 10px 0; text-align: center; }
        .menu-btn {
            background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.15s; width: 100%; margin-bottom: 4px;
        }
        .menu-btn:hover { background: var(--border); }
        .menu-btn.accent { background: var(--primary); border-color: var(--primary); color: #fff; }
        .menu-btn.accent:hover { background: var(--primary-hover); }

        /* Вкладки в меню */
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 10px; gap: 5px; }
        .tab-btn { background: none; border: none; color: var(--text); padding: 8px 12px; font-size: 13px; font-weight: 600; opacity: 0.5; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { opacity: 1; border-color: var(--primary); }
        .tab-content { display: none; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; padding-right: 4px; }
        .tab-content.active { display: flex; }

        /* Опции настроек */
        .setting-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; }
        .toggle-box { display: flex; gap: 4px; }
        .toggle-box button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; }
        .toggle-box button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        /* Сетки настроек тем и размеров */
        .theme-grid, .size-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .theme-grid button, .size-grid button { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        
        /* Виртуальная крестовина */
        #keyboardControls { width: 100%; max-width: 420px; display: none; grid-template-areas: ". up ." "left . right" ". down ."; gap: 8px; justify-content: center; margin-top: 15px; padding: 0 10px; }
        #keyboardControls button { width: 55px; height: 50px; border-radius: 12px; font-size: 18px; }

        /* Всплывающие уведомления */
        #toast { position: fixed; bottom: 30px; background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; transform: translateY(100px); opacity: 0; transition: transform 0.3s, opacity 0.3s; z-index: 1000; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); }
        #toast.show { transform: translateY(0); opacity: 1; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body class="dark">

    <div id="mainMenu" class="overlay" onclick="closeMenu(e, 'mainMenu')">

                <button class="menu-btn" onclick="openMenu('ghostMenu')">👻 Бросить вызов Призраку</button>

                        <button id="s-vib-off" onclick="toggleVibro(false); document.getElementById('s-vib-on').classList.remove('active'); this.classList.add('active')">ВЫКЛ</button>
                    </div>
                </div>
                <div class="setting-row">
                    <span>Экранные кнопки</span>

    <div id="toast">Ссылка скопирована!</div>

    <script>
        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => {
                    e.waitUntil(
                        caches.open('2048-ghost-v1').then(cache => cache.addAll(['/']))
                    );
                    self.skipWaiting();
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }

        // Локальное хранилище
        const LS = {
            get(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch(e) { return def; } },
            set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
        };

        // Генератор случайных чисел (ГПЧ)
        function mulberry32(a) { 
            return function() { 
                let t = a += 0x6D2B79F5; 
                t = Math.imul(t ^ t >>> 15, t | 1); 
                t ^= t + Math.imul(t ^ t >>> 7, t | 61); 
                return ((t ^ t >>> 14) >>> 0) / 4294967296; 
            } 
        }

        // Состояние игры
        let size = 4;
        let scoreV = 0;
        let bestV = LS.get('best_score_v2', 0);
        let g = [];
        let prevG = null; 
        let historyStack = [];
        let cellElements = [];
        let gameOver = false;
        let winShown = false;
        let paused = false;
        let currentSeed = null;
        let movesLog = [];
        let ghostMode = null;
        let ghostGrids = [];
        let newTiles = new Set();

        let audioCtx = null;
        let soundEnabled = LS.get('soundEnabled', '1') === '1';
        let vibroEnabled = LS.get('vibroEnabled', '1') === '1';

        let stats = { gamesPlayed: 0, wins: 0, totalScore: 0, bestTile: 0, totalTime: 0, startTime: 0 };
        const achievements = {
            score1000: { name:'Первая тысяча', desc:'1000 очков', icon:'💯', earned:false },
            score10000: { name:'Десятка', desc:'10000 очков', icon:'🔥', earned:false },
            tile256: { name:'256', desc:'Плитка 256', icon:'🧱', earned:false },
            tile1024: { name:'1024', desc:'Плитка 1024', icon:'💎', earned:false },
            tile2048: { name:'2048!', desc:'Победить', icon:'👑', earned:false },
            tile4096: { name:'4096', desc:'Плитка 4096', icon:'🌟', earned:false },
            undo5: { name:'Отступник', desc:'5 отмен', icon:'↩️', earned:false, count:0 },
            games10: { name:'Заядлый', desc:'10 игр', icon:'🎮', earned:false },
            speedRun: { name:'Быстрый', desc:'500 за 30с', icon:'⚡', earned:false },
            perfectStart: { name:'Идеально', desc:'2 плитки 4', icon:'🍀', earned:false },
            mergeMaster: { name:'Мастер', desc:'10 слияний', icon:'💥', earned:false, mergeCount:0 },
            noUndoWin: { name:'Честная победа', desc:'Без отмен', icon:'🏅', earned:false }
        };

        // DOM Элементы
        const boardEl = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const overlay = document.getElementById('gameOverOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const resultCardContainer = document.getElementById('resultCardContainer');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.textContent = msg || 'Ссылка скопирована!';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Аудио и вибро движок
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(t) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            const o = audioCtx.createOscillator(), gGain = audioCtx.createGain();
            o.connect(gGain); gGain.connect(audioCtx.destination); gGain.gain.value = 0.15;
            switch(t) {
                case 'move': o.frequency.value = 200; gGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); break;
                case 'merge': o.frequency.value = 400; gGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); break;
                case 'win': o.frequency.value = 600; gGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); break;
                case 'undo': o.frequency.value = 150; gGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08); break;
            }
            o.start(); o.stop(audioCtx.currentTime + 0.15);
        }

        function vibrate(d) { if (vibroEnabled && navigator.vibrate) navigator.vibrate(d); }
        function sfxMove() { playSound('move'); vibrate(8); }
        function sfxMerge() { playSound('merge'); vibrate(15); }
        function sfxWin() { playSound('win'); vibrate(30); }
        function sfxUndo() { playSound('undo'); }

        function toggleSound(v) { soundEnabled = v; localStorage.soundEnabled = v ? '1' : '0'; }
        function toggleVibro(v) { vibroEnabled = v; localStorage.vibroEnabled = v ? '1' : '0'; }
        function theme(t) { document.body.className = t; localStorage.theme = t; }
        function toggleButtons(show) { document.getElementById('keyboardControls').style.display = show ? 'grid' : 'none'; localStorage.showButtons = show ? '1' : '0'; }
        function changeSize(newSize) { if (newSize === size) return; size = newSize; localStorage.gridSize = size; start(); closeMenu(null, 'mainMenu', true); }

        function mk() { return Array(size).fill().map(() => Array(size).fill(0)); }

        // Универсальная функция генерации стартовой сетки из сида
        function generateGridFromSeed(seed, sz) {
            const rng = mulberry32(seed);
            const grid = Array(sz).fill().map(() => Array(sz).fill(0));
            for (let i = 0; i < 2; i++) {
                const empty = [];
                for (let y = 0; y < sz; y++) for (let x = 0; x < sz; x++) if (!grid[y][x]) empty.push([y,x]);
                if (!empty.length) break;
                const [y,x] = empty[Math.floor(rng() * empty.length)];
                grid[y][x] = rng() < 0.9 ? 2 : 4;
            }
            return grid;
        }

        function getDailySeed() {
            const date = new Date();
            return (date.getFullYear() * 10000 + (date.getMonth()+1) * 100 + date.getDate()) * 123;
        }

        function add() {
            const f = [];
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!g[y][x]) f.push([y,x]);
            if (!f.length) return;
            const [y,x] = f[Math.floor(Math.random() * f.length)];
            const val = Math.random() < .9 ? 2 : 4;
            g[y][x] = val;
            newTiles.add(`${y},${x}`);
            if (scoreV === 0 && val === 4) {
                let cnt = 0; for (let yy = 0; yy < size; yy++) for (let xx = 0; xx < size; xx++) if (g[yy][xx] === 4) cnt++;
                if (cnt === 2) unlockAchievement('perfectStart');
            }
        }

        // Единная оптимизированная функция сдвига рядов (DRY)
        function slideRow(row, targetSize, tracker, updateScoreGlobal = false) {
            let r = row.filter(Boolean);
            for (let i = 0; i < r.length - 1; i++) {
                if (r[i] === r[i + 1]) {
                    r[i] *= 2;
                    if (tracker) {
                        tracker.added += r[i];
                        tracker.merges++;
                    }
                    if (updateScoreGlobal) scoreV += r[i];
                    r[i + 1] = 0;
                }
            }
            r = r.filter(Boolean);
            while (r.length < targetSize) r.push(0);
            return r;
        }

        // Логика совершения хода
        function move(d) {
            if (paused || gameOver) return;
            
            historyStack.push({ 
                grid: structuredClone(g), 
                score: scoreV, 
                prevG: prevG ? structuredClone(prevG) : null 
            });
            if (historyStack.length > 50) historyStack.shift();

            let tracker = { added: 0, merges: 0 };
            prevG = structuredClone(g);
            let oldStr = JSON.stringify(g);

            if (d === 'l') g = g.map(r => slideRow(r, size, tracker, true));
            if (d === 'r') g = g.map(r => slideRow([...r].reverse(), size, tracker, true).reverse());
            if (d === 'u' || d === 'd') {
                for (let x = 0; x < size; x++) {
                    let c = g.map(r => r[x]); 
                    if (d === 'd') c.reverse(); 
                    c = slideRow(c, size, tracker, true); 
                    if (d === 'd') c.reverse();
                    for (let y = 0; y < size; y++) g[y][x] = c[y];
                }
            }

            if (oldStr !== JSON.stringify(g)) {
                movesLog.push(d);
                if (tracker.added > 0) { showScoreAddition(tracker.added); sfxMerge(); }
                else sfxMove();
                newTiles.clear();
                add();
                updateScore(); 
                render(true);
                checkGameState(); 
                checkAchievements(); 
                saveGame();
                if (ghostMode) updateGhostDisplay();
            } else {
                historyStack.pop();
            }
        }

        function showScoreAddition(amount) {
            const cont = document.getElementById('scoreAdditionContainer');
            if (!cont) return; cont.innerHTML = '';
            const el = document.createElement('div'); el.className = 'score-addition'; el.textContent = `+${amount}`; cont.appendChild(el);
        }

        function undo() {
            if (paused || gameOver) return;
            if (historyStack.length) {
                const prev = historyStack.pop();
                g = prev.grid; 
                scoreV = prev.score; 
                prevG = prev.prevG;
                movesLog.pop();
                newTiles.clear();
                updateScore(); 
                render(false); 
                sfxUndo(); 
                checkGameState(); 
                saveGame();
                achievements.undo5.count = (achievements.undo5.count || 0) + 1;
                if (achievements.undo5.count >= 5) unlockAchievement('undo5');
            }
        }

        function checkGameState() {
            let hasTarget = false;
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                if (g[y][x] >= 2048) hasTarget = true;
                if (g[y][x] > stats.bestTile) stats.bestTile = g[y][x];
            }
            if (hasTarget && !winShown) {
                winShown = true; overlayTitle.textContent = 'Вы победили! 🎉';
                overlay.style.display = 'flex'; gameOver = true; sfxWin();
                stats.wins++; saveStats(); endGame(); return;
            }
            let hasMoves = false;
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                if (!g[y][x]) hasMoves = true;
                if (x < size - 1 && g[y][x] === g[y][x+1]) hasMoves = true;
                if (y < size - 1 && g[y][x] === g[y+1][x]) hasMoves = true;
            }
            if (!hasMoves && !gameOver) {
                overlayTitle.textContent = 'Игра окончена! 👻';
                overlay.style.display = 'flex'; gameOver = true; endGame();
            }
        }

        function endGame() {
            stats.totalTime += Math.floor((Date.now() - stats.startTime) / 1000);
            stats.totalScore += scoreV; stats.gamesPlayed++;
            saveStats(); checkAchievements();
            if (ghostMode) finishGhostChallenge();
            else saveGhostRun();
            generateResultCard();
        }

        function finishGhostChallenge() { ghostMode = null; ghostGrids = []; render(); }

        function saveGhostRun() {
            if (!currentSeed || movesLog.length === 0) return;
            const ghost = { seed: currentSeed, size: size, moves: [...movesLog], score: scoreV, maxTile: stats.bestTile, date: Date.now() };
            const ghosts = LS.get('ghosts', []);
            ghosts.unshift(ghost);
            if (ghosts.length > 20) ghosts.pop();
            LS.set('ghosts', ghosts);
        }

        // Загрузка и симуляция призрака (Ghost Battle)
        function loadGhost(ghost) {
            ghostMode = ghost;
            size = ghost.size;
            currentSeed = ghost.seed;
            g = generateGridFromSeed(ghost.seed, size);
            ghostGrids = [];
            
            let simGrid = structuredClone(g);
            ghostGrids.push({ grid: structuredClone(simGrid), score: 0 });
            
            for (let d of ghost.moves) {
                if (d === 'l') simGrid = simGrid.map(r => slideRow([...r], size, null, false));
                else if (d === 'r') simGrid = simGrid.map(r => slideRow([...r].reverse(), size, null, false).reverse());
                else if (d === 'u' || d === 'd') {
                    for (let x = 0; x < size; x++) {
                        let col = simGrid.map(r => r[x]);
                        if (d === 'd') col.reverse();
                        col = slideRow(col, size, null, false);
                        if (d === 'd') col.reverse();
                        for (let y = 0; y < size; y++) simGrid[y][x] = col[y];
                    }
                }
                ghostGrids.push({ grid: structuredClone(simGrid), score: 0 });
            }
            scoreV = 0; movesLog = []; winShown = false; gameOver = false; paused = false;
            overlay.style.display = 'none'; pauseOverlay.style.display = 'none';
            historyStack = []; prevG = null; newTiles.clear();
            updateScore(); render(); updateGhostDisplay();
        }

        function updateGhostDisplay() {
            if (!ghostMode || !ghostGrids) return;
            const step = Math.min(movesLog.length, ghostGrids.length - 1);
            const ghostState = ghostGrids[step];
            cellElements.forEach(cell => cell.classList.remove('ghost'));
            if (!ghostState) return;
            const gg = ghostState.grid;
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                if (gg[y][x] && !g[y][x]) {
                    const idx = y * size + x;
                    if (cellElements[idx]) cellElements[idx].classList.add('ghost');
                }
            }
        }

        function start(seed = null) {
            size = parseInt(localStorage.gridSize) || 4;
            scoreV = 0; gameOver = false; winShown = false; paused = false;
            pauseOverlay.style.display = 'none'; overlay.style.display = 'none';
            historyStack = []; movesLog = [];
            currentSeed = seed || Math.floor(Math.random() * 2147483647);
            g = generateGridFromSeed(currentSeed, size);
            prevG = null; 
            cellElements = [];
            newTiles.clear();
            updateScore();
            requestAnimationFrame(() => {
                render();
                stats.startTime = Date.now();
                achievements.undo5.count = 0;
                achievements.mergeMaster.mergeCount = 0;
                ghostMode = null; ghostGrids = [];
                saveGame();
            });
        }

        function render(animate = false) {
            if (!boardEl) return;
            boardEl.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;
            const cellSize = 100 / size;
            const gap = 10; const padding = 12;

            if (!cellElements.length || cellElements.length !== size * size) {
                boardEl.innerHTML = ''; cellElements = [];
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const div = document.createElement('div');
                        div.className = 'cell';
                        div.style.width = `calc(${cellSize}% - ${gap}px)`; div.style.height = `calc(${cellSize}% - ${gap}px)`;
                        div.style.top = `calc(${y * cellSize}% + ${padding}px)`; div.style.left = `calc(${x * cellSize}% + ${padding}px)`;
                        boardEl.appendChild(div); cellElements.push(div);
                    }
                }
            }

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const idx = y * size + x; const cell = cellElements[idx]; const v = g[y][x]; const key = `${y},${x}`;
                    cell.style.top = `calc(${y * cellSize}% + ${padding}px)`; cell.style.left = `calc(${x * cellSize}% + ${padding}px)`;
                    cell.className = 'cell';
                    if (v) { cell.classList.add('tile', 'v' + v); cell.textContent = v; } 
                    else { cell.textContent = ''; }
                    if (newTiles.has(key)) cell.classList.add('new-tile');
                }
            }
            updateGhostDisplay();
        }

        function updateScore() {
            if (scoreEl) scoreEl.textContent = scoreV;
            if (scoreV > bestV) { bestV = scoreV; if (bestEl) bestEl.textContent = bestV; LS.set('best_score_v2', bestV); }
        }

        function saveGame() {
            if (gameOver) { localStorage.removeItem('savedGame'); return; }
            LS.set('savedGame', {
                size, grid: g, score: scoreV, historyStack: historyStack.slice(-20), movesLog,
                stats, achievements: Object.keys(achievements).reduce((a,k)=>{a[k]=achievements[k].earned; return a;},{}),
                winShown, theme: document.body.className, currentSeed, 
                ghostMode: ghostMode ? { seed: ghostMode.seed, score: ghostMode.score, moves: ghostMode.moves, maxTile: ghostMode.maxTile } : null
            });
        }

        function loadGame() {
            const saved = LS.get('savedGame');
            if (!saved) return false;
            size = saved.size || 4; g = saved.grid; scoreV = saved.score || 0;
            historyStack = saved.historyStack || []; movesLog = saved.movesLog || [];
            stats = saved.stats || stats; winShown = saved.winShown || false;
            theme(saved.theme || 'dark'); currentSeed = saved.currentSeed;
            ghostMode = saved.ghostMode || null;
            cellElements = [];
            updateScore();
            requestAnimationFrame(() => { render(); checkGameState(); });
            return true;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const activeTabBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
            if (activeTabBtn) activeTabBtn.classList.add('active');
            const activeTabCont = document.getElementById(`tab-${tabName}`);
            if (activeTabCont) activeTabCont.classList.add('active');
            if (tabName === 'stats') { renderStats(); renderAchievements(); }
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('tab-btn')) {
                const tab = e.target.dataset.tab;
                if (tab) switchTab(tab);
            }
        });

        // === ИНТЕРФЕЙСНЫЕ ФУНКЦИИ РЕЖИМА ПРИЗРАКА ===

        function showDailyChallenge() {
            const seed = getDailySeed();
            start(seed);
            showToast("Режим 'Daily Challenge' запущен!");
        }

        function openGhostList() {
            const ghosts = LS.get('ghosts', []);
            const cont = document.getElementById('ghostListContainer');
            if (!cont) return;
            cont.innerHTML = '';
            
            if (ghosts.length === 0) {
                cont.innerHTML = '<div style="text-align:center;opacity:0.5;padding:10px;">Нет записанных призраков</div>';
                return;
            }

            ghosts.forEach((gh, idx) => {
                const div = document.createElement('div');
                div.className = 'ghost-item';
                div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid var(--border); font-size:14px;';
                
                const date = new Date(gh.date).toLocaleDateString();
                div.innerHTML = `
                    <div>
                        <div><b>${gh.size}x${gh.size}</b> | Счет: ${gh.score}</div>
                        <div style="font-size:11px; opacity:0.6;">${date} | Ходов: ${gh.moves.length}</div>
                    </div>
                    <button class="menu-btn" style="padding:4px 10px; font-size:12px; margin:0; width:auto;" onclick="loadGhostFromList(${idx})">Баттл</button>
                `;
                cont.appendChild(div);
            });
        }

        function loadGhostFromList(index) {
            const ghosts = LS.get('ghosts', []);
            if (ghosts[index]) {
                loadGhost(ghosts[index]);
                closeMenu(null, 'ghostMenu', true);
                showToast("Баттл с призраком начался!");
            }
        }

        function challengeFriend() {
            if (movesLog.length === 0) {
                showToast("Сделайте хотя бы один ход, чтобы бросить вызов!");
                return;
            }
            const data = { seed: currentSeed, size: size, moves: [...movesLog], score: scoreV };
            try {
                const json = JSON.stringify(data);
                const b64 = btoa(unescape(encodeURIComponent(json)));
                const url = `${window.location.origin}${window.location.pathname}?challenge=${b64}`;
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(() => showToast("Ссылка скопирована! Отправь её другу."));
                } else {
                    const input = document.createElement('input');
                    input.value = url; document.body.appendChild(input);
                    input.select(); document.execCommand('copy');
                    document.body.removeChild(input);
                    showToast("Ссылка скопирована!");
                }
            } catch(e) {
                showToast("Ошибка генерации вызова.");
            }
        }

        function checkUrlGhost() {
            const params = new URLSearchParams(window.location.search);
            const challenge = params.get('challenge');
            if (challenge) {
                try {
                    const json = decodeURIComponent(escape(atob(challenge)));
                    const ghost = JSON.parse(json);
                    if (ghost && ghost.seed && ghost.moves) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                        setTimeout(() => {
                            loadGhost(ghost);
                            showToast(`Вызов принят! Призрак набрал: ${ghost.score}`);
                        }, 500);
                    }
                } catch(e) {
                    console.error("Ошибка разбора вызова из URL", e);
                }
            }
        }

        function generateResultCard() {
            const cont = document.getElementById('resultCardContainer');
            if (!cont) return;
            cont.innerHTML = `
                <div style="background:var(--bg-card); border:2px solid var(--primary); padding:15px; border-radius:10px; margin-top:15px; text-align:left;">
                    <h4 style="margin:0 0 10px 0; color:var(--primary); text-align:center;">📊 Итоги матча</h4>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; font-size:13px;">
                        <div>Размер поля: <b>${size}x${size}</b></div>
                        <div>Ваш счет: <b>${scoreV}</b></div>
                        <div>Лучшая плитка: <b>${stats.bestTile}</b></div>
                        <div>Сделано ходов: <b>${movesLog.length}</b></div>
                    </div>
                </div>
            `;
        }

        function shareResult() {
            const text = `Я набрал ${scoreV} очков в 2048 Ghost Battle на поле ${size}x${size}! СМОЖЕШЬ СЕСТЬ МНЕ НА ХВОСТ?`;
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
                window.Telegram.WebApp.openLink(`https://t.getshare.com/` + encodeURIComponent(text));
            } else if (navigator.share) {
                navigator.share({ title: '2048 Ghost Battle', text: text, url: window.location.href }).catch(()=>{});
            } else {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => showToast("Результат скопирован!"));
                }
            }
        }

        function renderAchievements() {
            const cont = document.getElementById('achievementsContainer');
            if (!cont) return;
            cont.innerHTML = '';
            
            const savedGame = LS.get('savedGame');
            const earnedMap = savedGame ? (savedGame.achievements || {}) : {};

            Object.keys(achievements).forEach(key => {
                const ach = achievements[key];
                if (earnedMap[key]) ach.earned = true;

                const div = document.createElement('div');
                div.className = `ach-item ${ach.earned ? 'unlocked' : 'locked'}`;
                div.style.cssText = `display:flex; align-items:center; gap:10px; padding:8px; border-radius:6px; margin-bottom:6px; background:${ach.earned ? 'rgba(16,185,129,0.1)' : 'rgba(255,255,255,0.02)'}; border:1px solid ${ach.earned ? 'var(--primary)' : 'var(--border)'}; opacity:${ach.earned ? '1' : '0.5'}`;
                
                div.innerHTML = `
                    <div style="font-size:24px;">${ach.icon}</div>
                    <div>
                        <div style="font-weight:bold; font-size:13px;">${ach.name}</div>
                        <div style="font-size:11px; opacity:0.7;">${ach.desc}</div>
                    </div>
                `;
                cont.appendChild(div);
            });
        }

        function unlockAchievement(id) {
            if (achievements[id] && !achievements[id].earned) {
                achievements[id].earned = true;
                showToast(`🏆 Достижение: ${achievements[id].name}`);
                saveGame();
            }
        }

        // Автоматическая проверка наград
        function checkAchievements() {
            if (scoreV >= 1000) unlockAchievement('score1000');
            if (scoreV >= 10000) unlockAchievement('score10000');
            
            let has256 = false, has1024 = false, has2048 = false, has4096 = false;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (g[y][x] >= 256) has256 = true;
                    if (g[y][x] >= 1024) has1024 = true;
                    if (g[y][x] >= 2048) has2048 = true;
                    if (g[y][x] >= 4096) has4096 = true;
                }
            }
            if (has256) unlockAchievement('tile256');
            if (has1024) unlockAchievement('tile1024');
            if (has2048) unlockAchievement('tile2048');
            if (has4096) unlockAchievement('tile4096');

            if (stats.gamesPlayed >= 10) unlockAchievement('games10');
            if (scoreV >= 500 && (Date.now() - stats.startTime) <= 30000) unlockAchievement('speedRun');
        }

        function togglePause() {
            paused = !paused;
            pauseOverlay.style.display = paused ? 'flex' : 'none';
        }

        function openMenu(id) {
            const m = document.getElementById(id); if (!m) return;
            if (id === 'mainMenu') switchTab('game');
            if (id === 'ghostMenu') openGhostList();
            m.style.display = 'flex'; setTimeout(() => m.classList.add('open'), 10);
        }

        function closeMenu(e, id, force = false) {
            const m = document.getElementById(id);
            if (m && (force || e.target === m)) { m.classList.remove('open'); setTimeout(() => m.style.display = 'none', 250); }
        }

        function loadStats() { stats = LS.get('stats2048', stats); }
        function saveStats() { LS.set('stats2048', stats); }
        function renderStats() {
            const c = document.getElementById('statsContainer'); if (!c) return;
            const h = Math.floor(stats.totalTime / 3600), m = Math.floor((stats.totalTime % 3600) / 60);
            const league = bestV >= 50000 ? 'Elite' : bestV >= 20000 ? 'Gold' : bestV >= 10000 ? 'Silver' : 'Bronze';
            c.innerHTML = `<div>🎮 Игр: <b>${stats.gamesPlayed}</b></div><div>🏆 Побед: <b>${stats.wins}</b></div><div>⭐ Плитка: <b>${stats.bestTile}</b></div><div>🕒 Время: <b>${h}ч ${m}м</b></div><div>🏅 Лига: <b>${league}</b></div>`;
        }

        // Слушатели клавиатуры и свайпов
        document.addEventListener('keydown', e => {
            if (['ArrowUp', 'KeyW'].includes(e.code)) move('u');
            if (['ArrowDown', 'KeyS'].includes(e.code)) move('d');
            if (['ArrowLeft', 'KeyA'].includes(e.code)) move('l');
            if (['ArrowRight', 'KeyD'].includes(e.code)) move('r');
        });

        let tsX, tsY;
        document.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, {passive: true});
        document.addEventListener('touchend', e => {
            if (!tsX || !tsY) return;
            let tdX = e.changedTouches[0].clientX - tsX, tdY = e.changedTouches[0].clientY - tsY;
            if (Math.max(Math.abs(tdX), Math.abs(tdY)) > 40) {
                if (Math.abs(tdX) > Math.abs(tdY)) move(tdX > 0 ? 'r' : 'l');
                else move(tdY > 0 ? 'd' : 'u');
            }
            tsX = null; tsY = null;
        }, {passive: true});

        function init() {
            loadStats();
            if (!loadGame()) start();
            if (localStorage.showButtons === '1') toggleButtons(true);
            checkUrlGhost();
        }
        init();
    </script>
</body>
</html>
